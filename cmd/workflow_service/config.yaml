env: "local"
grpc_port: "8085"

database:
  dsn: ""

services:
  notification_addr: "notification_service:8087"
  project_addr: "project_service:8083"
  team_addr: "team_service:8084"

outbox_poller:
  enabled: true
  topic: "workflow-actions"
  interval_seconds: 2
  batch_size: 20

  table: "outbox_events"
  id_column: "id"
  topic_column: "topic"
  status_column: "status"
  event_type_column: "event_type"
  payload_column: "payload"
  processed_at_column: "processed_at"

  pending_status: "pending"
  processing_status: "processing"
  processed_status: "processed"
