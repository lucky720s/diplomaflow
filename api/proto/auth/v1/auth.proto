syntax = "proto3";

package auth.v1;

import "validate/validate.proto";

option go_package = "github.com/lucky720s/diplomaflow/pkg/protobuf/auth/v1";

service AuthService {
  rpc Register (RegisterRequest) returns (RegisterResponse);
  rpc Login (LoginRequest) returns (LoginResponse);
  rpc ValidateToken (ValidateTokenRequest) returns (ValidateTokenResponse);
  rpc ListUsers (ListUsersRequest) returns (ListUsersResponse);
  rpc RefreshToken (RefreshTokenRequest) returns (RefreshTokenResponse);
  rpc ListSessions (ListSessionsRequest) returns (ListSessionsResponse);
  rpc RevokeSession (RevokeSessionRequest) returns (RevokeSessionResponse);

  // Base role (users.role): student|teacher|admin
  rpc AssignRole (AssignRoleRequest) returns (AssignRoleResponse);

  // Internal
  rpc BatchGetUserPreviews(BatchGetUserPreviewsRequest) returns (BatchGetUserPreviewsResponse);

  // =========================
  // Dynamic department roles (directory + assignments)
  // =========================

  // Directory (CRUD)
  rpc CreateDepartmentRole(CreateDepartmentRoleRequest) returns (CreateDepartmentRoleResponse);
  rpc ListDepartmentRoles(ListDepartmentRolesRequest) returns (ListDepartmentRolesResponse);
  rpc GetDepartmentRole(GetDepartmentRoleRequest) returns (GetDepartmentRoleResponse);
  rpc DeleteDepartmentRole(DeleteDepartmentRoleRequest) returns (DeleteDepartmentRoleResponse);

  // Assignments
  rpc AssignDepartmentRole(AssignDepartmentRoleRequest) returns (AssignDepartmentRoleResponse);
  rpc RevokeDepartmentRole(RevokeDepartmentRoleRequest) returns (RevokeDepartmentRoleResponse);
  rpc ListUserDepartmentRoles(ListUserDepartmentRolesRequest) returns (ListUserDepartmentRolesResponse);
}

message RegisterRequest {
  string email = 1 [(validate.rules).string.email = true];
  string password = 2 [(validate.rules).string.min_len = 8];
  string first_name = 3;
  string last_name = 4;
  string role = 5;
  int64 university_id = 6;
  int64 department_id = 7;
}

message RegisterResponse {
  int64 user_id = 1;
}

message LoginRequest {
  string email = 1;
  string password = 2;
  string user_agent = 3;
  string ip_address = 4;
}

message LoginResponse {
  string access_token = 1;
  string refresh_token = 2;
}

message ValidateTokenRequest {
  string token = 1;
}

message ValidateTokenResponse {
  int64 status = 1;
  string error = 2;
  int64 user_id = 3;
  string role = 4;
  int64 university_id = 5;
  int64 department_id = 6;
}

message ListUsersRequest {
  int64 university_id = 1;
  int64 department_id = 2;
  string role = 3;
  int32 page = 4;
  int32 page_size = 5;
  int64 exclude_user_id = 6;
}

message UserPreview {
  int64 id = 1;
  string email = 2;
  string first_name = 3;
  string last_name = 4;
  string role = 5;
  int64 university_id = 6;
  int64 department_id = 7;
}

message ListUsersResponse {
  repeated UserPreview users = 1;
  int64 total_count = 2;
}

message RefreshTokenRequest {
  string refresh_token = 1;
  string user_agent = 2;
  string ip_address = 3;
}

message RefreshTokenResponse {
  string access_token = 1;
  string refresh_token = 2;
}

message ListSessionsRequest {
  int64 user_id = 1;
}

message Session {
  uint64 id = 1;
  string user_agent = 2;
  string ip_address = 3;
  string created_at = 4;
  string expires_at = 5;
  bool is_current = 6;
}

message ListSessionsResponse {
  repeated Session sessions = 1;
}

message RevokeSessionRequest {
  int64 user_id = 1;
  uint64 session_id = 2;
}

message RevokeSessionResponse {
  bool success = 1;
}

message AssignRoleRequest {
  int64 user_id = 1;
  string role = 2;
}

message AssignRoleResponse {
  bool success = 1;
  string message = 2;
}

message BatchGetUserPreviewsRequest { repeated int64 ids = 1; }
message BatchGetUserPreviewsResponse { repeated UserPreview users = 1; }

// =========================
// Dynamic department roles
// =========================

message DepartmentRole {
  int64 id = 1;
  string slug = 2;
  int64 department_id = 3;
}

message CreateDepartmentRoleRequest {
  int64 department_id = 1 [(validate.rules).int64.gt = 0];
  string slug = 2 [(validate.rules).string = {min_len: 3, max_len: 32, pattern: "^[a-z][a-z0-9_]{2,31}$"}];
}

message CreateDepartmentRoleResponse {
  DepartmentRole role = 1;
}

message ListDepartmentRolesRequest {
  int64 department_id = 1 [(validate.rules).int64.gt = 0];
}

message ListDepartmentRolesResponse {
  repeated DepartmentRole roles = 1;
}

message GetDepartmentRoleRequest {
  int64 role_id = 1 [(validate.rules).int64.gt = 0];
}

message GetDepartmentRoleResponse {
  DepartmentRole role = 1;
}

message DeleteDepartmentRoleRequest {
  int64 role_id = 1 [(validate.rules).int64.gt = 0];
}

message DeleteDepartmentRoleResponse {
  bool success = 1;
}

// =========================
// Assignments
// =========================

message AssignDepartmentRoleRequest {
  int64 user_id = 1 [(validate.rules).int64.gt = 0];
  int64 department_id = 2 [(validate.rules).int64.gt = 0];
  int64 role_id = 3 [(validate.rules).int64.gt = 0];
  string comment = 4;
}

message AssignDepartmentRoleResponse {
  bool success = 1;
}

message RevokeDepartmentRoleRequest {
  int64 user_id = 1 [(validate.rules).int64.gt = 0];
  int64 department_id = 2 [(validate.rules).int64.gt = 0];
  int64 role_id = 3 [(validate.rules).int64.gt = 0];
  string comment = 4;
}

message RevokeDepartmentRoleResponse {
  bool success = 1;
}

message ListUserDepartmentRolesRequest {
  int64 user_id = 1 [(validate.rules).int64.gt = 0];
  int64 department_id = 2 [(validate.rules).int64.gt = 0];
}

message ListUserDepartmentRolesResponse {
  repeated string slugs = 1;
}
