syntax = "proto3";
package project.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/lucky720s/diplomaflow/pkg/protobuf/project/v1";

service ProjectService {
  rpc CreateProject (CreateProjectRequest) returns (CreateProjectResponse);
  rpc GetProject (GetProjectRequest) returns (GetProjectResponse);
  rpc GetStudentProjects (GetStudentProjectsRequest) returns (GetStudentProjectsResponse);
  rpc PerformAction (PerformActionRequest) returns (PerformActionResponse);
  rpc GetProjectRuntime (GetProjectRuntimeRequest) returns (GetProjectRuntimeResponse);
  rpc CommitTransition (CommitTransitionRequest) returns (CommitTransitionResponse);
  rpc UpdateProject (UpdateProjectRequest) returns (UpdateProjectResponse);
  rpc ArchiveProject (ArchiveProjectRequest) returns (ArchiveProjectResponse);
  rpc DeleteProject (DeleteProjectRequest) returns (DeleteProjectResponse);

  // Internal/Admin RPCs
  rpc ListProjectsRuntime (ListProjectsRuntimeRequest) returns (ListProjectsRuntimeResponse);
  rpc ListProjectStateHistory (ListProjectStateHistoryRequest) returns (ListProjectStateHistoryResponse);
}

message CreateProjectRequest {
  string title = 1;
  string description = 2;
  int64 student_id = 3;
  string workflow_name = 4;
  int64 university_id = 5;
  int64 department_id = 6;
  int64 team_id = 7;
}

message CreateProjectResponse {
  int64 project_id = 1;
  string status = 2;
}

message GetProjectRequest {int64 project_id = 1;}

message StateHistory {
  string state_name = 1;
  string status = 2;
  int64 changed_by = 3;
  string comment = 4;
  string timestamp = 5;
}

message GetProjectResponse {
  int64 project_id = 1;
  string title = 2;
  string description = 3;
  int64 student_id = 4;
  int64 team_id = 5;
  string workflow_name = 6;
  string current_state = 7;
  string status = 8;
  repeated StateHistory history = 9;
  google.protobuf.Timestamp topic_registered_at = 10;
}

message GetStudentProjectsRequest {int64 student_id = 1;}

message ProjectPreview {
  int64 project_id = 1;
  string title = 2;
  string status = 3;
  string current_state = 4;
  int64 team_id = 5;
  int64 workflow_id = 6;
  int64 current_state_id = 7;

  string workflow_name = 8;
  string current_state_name = 9;
  google.protobuf.Timestamp deadline_at = 10;
  google.protobuf.Timestamp topic_registered_at = 11;
}

message GetStudentProjectsResponse {repeated ProjectPreview projects = 1;}

message PerformActionRequest {
  int64 project_id = 1;
  string action_name = 2; // MUST equal Transition.event_name
  google.protobuf.Struct payload = 3;
}

message PerformActionResponse {
  int64 project_id = 1;
  string new_state = 2;
}

// ================= INTERNAL =================

message GetProjectRuntimeRequest {int64 project_id = 1;}

message GetProjectRuntimeResponse {
  int64 project_id = 1;

  int64 student_id = 2;
  int64 team_id = 3;
  int64 university_id = 4;
  int64 department_id = 5;

  int64 workflow_id = 6;
  int32 workflow_version = 7;
  string workflow_name = 8;

  int64 current_state_id = 9;
  string current_state_name = 10;

  string status = 11;
  google.protobuf.Struct data = 12;

  google.protobuf.Timestamp deadline_at = 13;
  google.protobuf.Timestamp topic_registered_at = 14;
}

message PostCommitActionGroup {
  string trigger = 1;       // "ON_ENTER", "ON_EXIT", "ON_DEADLINE"
  repeated int64 action_ids = 2;
}

message CommitTransitionRequest {
  int64 project_id = 1;

  int64 expected_from_state_id = 2;

  int64 transition_id = 3;
  string event_name = 4;

  int64 to_state_id = 5;
  string to_state_name = 6;

  int64 changed_by = 7;
  string comment = 8;

  google.protobuf.Timestamp new_deadline_at = 9;

  google.protobuf.Struct data_patch = 10;
  repeated PostCommitActionGroup post_actions = 11;

  string set_status = 12;

  // Extra history metadata (direction, actor_role, transition_id for audit)
  google.protobuf.Struct history_metadata = 13;
}

message CommitTransitionResponse {
  bool success = 1;
  int64 project_id = 2;
  int64 new_state_id = 3;
  string new_state_name = 4;
  string status = 5;
}
message UpdateProjectRequest {
  int64 project_id = 1;
  string title = 2;
  string description = 3;
  int64 student_id = 4;
  int64 team_id = 5;
  google.protobuf.Struct data_patch = 6;
}

message UpdateProjectResponse { bool success = 1; }

message ArchiveProjectRequest { int64 project_id = 1; string reason = 2; }
message ArchiveProjectResponse { bool success = 1; string status = 2; }

message DeleteProjectRequest { int64 project_id = 1; string reason = 2; }
message DeleteProjectResponse { bool success = 1; }

// ================= ADMIN/INTERNAL LIST =================

message ListProjectsRuntimeRequest {
  int64 department_id = 1;
  int64 university_id = 2;
  int64 workflow_id   = 3;
  int64 state_id      = 4;
  int64 team_id       = 5;
  int64 student_id    = 6;
  string status       = 7;
  string search       = 8;
  int32  page         = 9;
  int32  page_size    = 10;
}

message ProjectRuntimeSummary {
  int64  project_id        = 1;
  string title             = 2;
  int64  student_id        = 3;
  int64  team_id           = 4;
  int64  university_id     = 5;
  int64  department_id     = 6;
  int64  workflow_id       = 7;
  int32  workflow_version  = 8;
  string workflow_name     = 9;
  int64  current_state_id  = 10;
  string current_state_name = 11;
  string status            = 12;
  google.protobuf.Timestamp deadline_at         = 13;
  google.protobuf.Timestamp topic_registered_at = 14;
  google.protobuf.Timestamp created_at          = 15;
  google.protobuf.Timestamp updated_at          = 16;
  google.protobuf.Timestamp last_transition_at  = 17;
}

message ListProjectsRuntimeResponse {
  repeated ProjectRuntimeSummary projects = 1;
  int32 total = 2;
  int32 page  = 3;
  int32 page_size = 4;
}

message ListProjectStateHistoryRequest {
  int64 project_id = 1;
  int32 limit      = 2;
  string order     = 3; // "asc" | "desc" (default "desc")
}

message ProjectStateHistoryItem {
  int64  id             = 1;
  int64  project_id     = 2;
  string event_name     = 3;
  string status         = 4;
  int64  changed_by     = 5;
  string comment        = 6;
  int64  from_state_id  = 7;
  int64  to_state_id    = 8;
  string from_state_name = 9;
  string to_state_name  = 10;
  int64  transition_id  = 11;
  string direction      = 12;
  string actor_role     = 13;
  google.protobuf.Struct metadata = 14;
  google.protobuf.Timestamp created_at = 15;
}

message ListProjectStateHistoryResponse {
  repeated ProjectStateHistoryItem items = 1;
}
