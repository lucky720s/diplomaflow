syntax = "proto3";

package team;

option go_package = "github.com/lucky720s/diplomaflow/pkg/protobuf/team/v1";

service TeamService {
  rpc CreateTeam (CreateTeamRequest) returns (CreateTeamResponse);
  rpc GetTeam (GetTeamRequest) returns (GetTeamResponse);
  rpc GetAvailableStudents (GetAvailableStudentsRequest) returns (GetAvailableStudentsResponse);
  rpc AssignProject (AssignProjectRequest) returns (AssignProjectResponse);
  rpc GetMyInvites (GetMyInvitesRequest) returns (GetMyInvitesResponse);
  rpc RespondToInvite (RespondToInviteRequest) returns (RespondToInviteResponse);
}
message CreateTeamRequest {
  string name = 1;
  int64 project_id = 2;
  repeated int64 member_ids = 3;
  int64 leader_id = 4;
}

message CreateTeamResponse {
  int64 team_id = 1;
}

message GetTeamRequest {
  int64 team_id = 1;
}

message TeamMember {
  int64 user_id = 1;
  string role = 2;
}

message GetTeamResponse {
  int64 team_id = 1;
  string name = 2;
  int64 project_id = 3;
  repeated TeamMember members = 4;
}

message GetAvailableStudentsRequest {
  int64 university_id = 1;
  int64 exclude_user_id = 2;
}

message StudentPreview {
  int64 id = 1;
  string full_name = 2;
  string email = 3;
}

message GetAvailableStudentsResponse {
  repeated StudentPreview students = 1;
}
message AssignProjectRequest {
  int64 team_id = 1;
  int64 project_id = 2;
}

message AssignProjectResponse {
  bool success = 1;
}




message Invite {
  int64 id = 1;
  int64 team_id = 2;
  string team_name = 3;
  int64 inviter_id = 4;
  string status = 5;
}

message GetMyInvitesRequest {
  int64 user_id = 1;
}

message GetMyInvitesResponse {
  repeated Invite invites = 1;
}

message RespondToInviteRequest {
  int64 invite_id = 1;
  int64 user_id = 2;
  bool accept = 3;
}

message RespondToInviteResponse {
  bool success = 1;
  string message = 2;
}