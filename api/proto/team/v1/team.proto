syntax = "proto3";

package team.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "validate/validate.proto";

option go_package = "github.com/lucky720s/diplomaflow/pkg/protobuf/team/v1";

service TeamService {
  rpc CreateTeam (CreateTeamRequest) returns (CreateTeamResponse);
  rpc GetTeam (GetTeamRequest) returns (GetTeamResponse);
  rpc GetAvailableStudents (GetAvailableStudentsRequest) returns (GetAvailableStudentsResponse);
  rpc GetMyInvites (GetMyInvitesRequest) returns (GetMyInvitesResponse);
  rpc RespondToInvite (RespondToInviteRequest) returns (RespondToInviteResponse);
  rpc GetMyTeam (GetMyTeamRequest) returns (GetMyTeamResponse);
  rpc ListTeams (ListTeamsRequest) returns (ListTeamsResponse);
  rpc UpdateTeam (UpdateTeamRequest) returns (UpdateTeamResponse);
  rpc DeleteTeam (DeleteTeamRequest) returns (google.protobuf.Empty);
  rpc AddMember (AddMemberRequest) returns (AddMemberResponse);
  rpc RemoveMember (RemoveMemberRequest) returns (google.protobuf.Empty);
  rpc LeaveTeam (LeaveTeamRequest) returns (LeaveTeamResponse);
  rpc TransferLeadership (TransferLeadershipRequest) returns (TransferLeadershipResponse);
  rpc JoinTeamByCode (JoinTeamByCodeRequest) returns (JoinTeamByCodeResponse);
  rpc RegenerateInviteCode (RegenerateInviteCodeRequest) returns (RegenerateInviteCodeResponse);
  rpc LockTeamComposition (LockTeamCompositionRequest) returns (LockTeamCompositionResponse);
}
message CreateTeamRequest {
  string name = 1;
  repeated int64 member_ids = 2;
  int64 leader_id = 3;
}

message CreateTeamResponse {
  int64 team_id = 1;
}

message GetTeamRequest {
  int64 team_id = 1;
}

message TeamMember {
  int64 user_id = 1;
  string role = 2;
  string first_name = 3;
  string last_name = 4;
  string email = 5;
}


message GetTeamResponse {
  int64 team_id = 1;
  string name = 2;
  repeated TeamMember members = 3;
}

message GetAvailableStudentsRequest {
  int64 university_id = 1;
  int64 department_id = 2;
  int64 exclude_user_id = 3;
  int32 page = 4;
  int32 page_size = 5;
}

message StudentPreview {
  int64 id = 1;
  string full_name = 2;
  string email = 3;
}

message GetAvailableStudentsResponse {
  repeated StudentPreview students = 1;
}





message Invite {
  int64 id = 1;
  int64 team_id = 2;
  string team_name = 3;
  int64 inviter_id = 4;
  string status = 5;
}

message GetMyInvitesRequest {
  int64 user_id = 1;
}

message GetMyInvitesResponse {
  repeated Invite invites = 1;
}

message RespondToInviteRequest {
  int64 invite_id = 1;
  int64 user_id = 2;
  bool accept = 3;
}

message RespondToInviteResponse {
  bool success = 1;
  string message = 2;
}
message GetMyTeamRequest {
  int64 user_id = 1;
}

message GetMyTeamResponse {
  bool has_team = 1;
  TeamInfo team = 2;
}
message TeamInfo {
  int64 team_id = 1;
  string name = 2;
  string role = 3;
  repeated TeamMember members = 4;
  int32 member_count = 5;
  int32 pending_invites_count = 6;
  string invite_code = 7;
  bool composition_locked = 8;
  int64 supervisor_id = 9;
  SupervisorPreview supervisor = 10;
}
message SupervisorPreview {
  int64 id = 1;
  string full_name = 2;
  string email = 3;
}
message UpdateTeamRequest {
  Team team = 1;
  google.protobuf.FieldMask update_mask = 2;
  int64 requester_id = 3;
}

message UpdateTeamResponse {
  Team team = 1;
}

message DeleteTeamRequest {
  int64 team_id = 1;
  int64 requester_id = 2;
}

message AddMemberRequest {
  int64 team_id = 1;
  int64 user_id = 2;
  string role = 3;
}

message AddMemberResponse {
  bool success = 1;
  string message = 2;
}

message RemoveMemberRequest {
  int64 team_id = 1;
  int64 user_id = 2;
  int64 requester_id = 3;

}
message Team {
  int64 id = 1;
  string name = 2;
  repeated TeamMember members = 3;
  string created_at = 4;
}

message ListTeamsRequest {
  int64 department_id = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message ListTeamsResponse {
  repeated Team teams = 1;
  int64 total_count = 2;
}

message LeaveTeamRequest {
  int64 team_id = 1 [(validate.rules).int64.gt = 0];
  int64 user_id = 2 [(validate.rules).int64.gt = 0];
}

message LeaveTeamResponse {
  bool success = 1;
  string message = 2;
  bool team_deleted = 3;
  int64 new_leader_id = 4;
}

message TransferLeadershipRequest {
  int64 team_id = 1 [(validate.rules).int64.gt = 0];
  int64 current_leader_id = 2 [(validate.rules).int64.gt = 0];
  int64 new_leader_id = 3 [(validate.rules).int64.gt = 0];
}

message TransferLeadershipResponse {
  bool success = 1;
  string message = 2;
  TeamInfo updated_team = 3;
}
message JoinTeamByCodeRequest {
  string invite_code = 1 [(validate.rules).string.min_len = 6, (validate.rules).string.max_len = 6];
}
message JoinTeamByCodeResponse {
  bool success = 1;
  string message = 2;
  int64 team_id = 3;
}

message RegenerateInviteCodeRequest {
  int64 team_id = 1 [(validate.rules).int64.gt = 0];
}
message RegenerateInviteCodeResponse {
  string invite_code = 1;
}

message LockTeamCompositionRequest {
  int64 team_id = 1 [(validate.rules).int64.gt = 0];
  string reason = 2;
}
message LockTeamCompositionResponse {
  bool success = 1;
}
