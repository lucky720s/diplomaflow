syntax = "proto3";

package chat.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

option go_package = "github.com/lucky720s/diplomaflow/pkg/protobuf/chat/v1";

// ChatService — обмен сообщениями (студент↔руководитель, команда, группа).
// Источник правды для истории сообщений; realtime-доставку (WebSocket) держит
// gateway, этот сервис только персистит и отдаёт данные.
service ChatService {
  rpc CreateConversation (CreateConversationRequest) returns (CreateConversationResponse);
  rpc ListConversations (ListConversationsRequest) returns (ListConversationsResponse);
  rpc GetConversation (GetConversationRequest) returns (GetConversationResponse);
  rpc SendMessage (SendMessageRequest) returns (SendMessageResponse);
  rpc ListMessages (ListMessagesRequest) returns (ListMessagesResponse);
  rpc MarkRead (MarkReadRequest) returns (google.protobuf.Empty);
}

message Conversation {
  int64 id = 1;
  string type = 2; // direct | group
  string title = 3;
  repeated int64 participant_ids = 4;
  google.protobuf.Timestamp created_at = 5;
}

message Message {
  int64 id = 1;
  int64 conversation_id = 2;
  int64 sender_id = 3;
  string content = 4;
  google.protobuf.Timestamp created_at = 5;
}

message ConversationPreview {
  Conversation conversation = 1;
  Message last_message = 2;
  int64 unread_count = 3;
}

// requester_id / sender_id / user_id заполняются сервисом из metadata (x-user-id),
// тело в этой части не доверяется.
message CreateConversationRequest {
  int64 requester_id = 1;
  string type = 2;
  string title = 3;
  repeated int64 participant_ids = 4;
}
message CreateConversationResponse {
  Conversation conversation = 1;
}

message ListConversationsRequest {
  int64 user_id = 1;
}
message ListConversationsResponse {
  repeated ConversationPreview conversations = 1;
}

message GetConversationRequest {
  int64 conversation_id = 1;
  int64 requester_id = 2;
}
message GetConversationResponse {
  Conversation conversation = 1;
}

message SendMessageRequest {
  int64 conversation_id = 1;
  int64 sender_id = 2;
  string content = 3;
}
message SendMessageResponse {
  Message message = 1;
  // Участники беседы — gateway использует их для realtime-рассылки по WebSocket,
  // чтобы не делать отдельный запрос на каждое сообщение.
  repeated int64 participant_ids = 2;
}

message ListMessagesRequest {
  int64 conversation_id = 1;
  int64 requester_id = 2;
  int32 page = 3;
  int32 page_size = 4;
}
message ListMessagesResponse {
  repeated Message messages = 1;
  int64 total_count = 2;
}

message MarkReadRequest {
  int64 conversation_id = 1;
  int64 user_id = 2;
  int64 last_read_message_id = 3;
}
