syntax = "proto3";

package notification.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/lucky720s/diplomaflow/pkg/protobuf/notification/v1";

service NotificationService {
  rpc SendNotification (SendNotificationRequest) returns (SendNotificationResponse);
  rpc ListNotifications (ListNotificationsRequest) returns (ListNotificationsResponse);
  rpc MarkAsRead (MarkAsReadRequest) returns (google.protobuf.Empty);
  rpc DeleteNotification (DeleteNotificationRequest) returns (google.protobuf.Empty);
  rpc MarkAllAsRead (MarkAllAsReadRequest) returns (MarkAllAsReadResponse);

  // Mobile push (FCM): регистрация/удаление device-токенов.
  // user_id берётся из metadata (x-user-id), а не из тела запроса.
  rpc RegisterDevice (RegisterDeviceRequest) returns (RegisterDeviceResponse);
  rpc UnregisterDevice (UnregisterDeviceRequest) returns (google.protobuf.Empty);
  rpc ListDevices (ListDevicesRequest) returns (ListDevicesResponse);
}

message SendNotificationRequest {
  int64 user_id = 1;
  string title = 2;
  string message = 3;
  string link = 4;
  string type = 5;
}

message SendNotificationResponse {
  int64 notification_id = 1;
}

message ListNotificationsRequest {
  int64 user_id = 1;
  bool only_unread = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message Notification {
  int64 id = 1;
  string title = 2;
  string message = 3;
  string link = 4;
  string type = 5;
  bool is_read = 6;
  google.protobuf.Timestamp created_at = 7;
}

message ListNotificationsResponse {
  repeated Notification notifications = 1;
  int64 total_count = 2;
}

message MarkAsReadRequest {
  int64 notification_id = 1;
  int64 user_id = 2;
}

message DeleteNotificationRequest {
  int64 notification_id = 1;
  int64 user_id = 2;
}

message MarkAllAsReadRequest {
  int64 user_id = 1;
}

message MarkAllAsReadResponse {
  int32 updated_count = 1;
}

// ==================== Mobile push (FCM) ====================

message DeviceToken {
  int64 id = 1;
  string token = 2;
  string platform = 3; // android | ios | web
  google.protobuf.Timestamp created_at = 4;
}

message RegisterDeviceRequest {
  // user_id заполняется из metadata на стороне сервиса; в теле игнорируется.
  int64 user_id = 1;
  string token = 2;
  string platform = 3;
}

message RegisterDeviceResponse {
  DeviceToken device = 1;
}

message UnregisterDeviceRequest {
  int64 user_id = 1;
  string token = 2;
}

message ListDevicesRequest {
  int64 user_id = 1;
}

message ListDevicesResponse {
  repeated DeviceToken devices = 1;
}