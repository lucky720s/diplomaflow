syntax = "proto3";

package file.v1;

option go_package = "github.com/lucky720s/diplomaflow/pkg/protobuf/file/v1";

service FileService {
  rpc UploadFile(stream UploadFileRequest) returns (UploadFileResponse);
  rpc GetFileInfo(GetFileInfoRequest) returns (GetFileInfoResponse);
  rpc DeleteFile(DeleteFileRequest) returns (DeleteFileResponse);
  rpc DownloadFile(DownloadFileRequest) returns (stream DownloadFileResponse);
}

message UploadFileRequest {
  oneof data {
    FileInfo info = 1;
    bytes chunk = 2;
  }
}

message FileInfo {
  // Example: ".pdf" (extension) or logical file type if you use it that way
  string file_type = 1;

  // Original client filename (used to preserve extension & show name in UI)
  string file_name = 2;

  // Who uploads (from gateway token)
  int64 user_id = 3;

  // Optional: project attachment
  int64 project_id = 4;
}

// FileRef is the unified file contract shared across all product responses
// that reference a document or attachment.
message FileRef {
  string file_id = 1;      // stable backend identifier (uuid), NOT the original name
  string file_name = 2;    // safe original name for display & download
  string file_type = 3;    // stored MIME type (resolved from extension if unknown)
  int64 size = 4;          // size in bytes
  string file_url = 5;     // base file endpoint, e.g. /api/v1/files/{file_id}
  string download_url = 6; // forced download, e.g. /api/v1/files/{file_id}?download=1
  string preview_url = 7;  // inline preview, e.g. /api/v1/files/{file_id}?disposition=inline
}

message UploadFileResponse {
  // Stable ID (uuid) WITHOUT extension
  string id = 1;
  uint32 size = 2;
  // Unified file contract (preferred by new clients).
  FileRef file = 3;
}

message GetFileInfoRequest {
  string id = 1; // stable id (uuid) or legacy stored filename
}

message GetFileInfoResponse {
  string id = 1;           // stable id
  string name = 2;         // original file name (if known)
  string download_url = 3; // usually gateway URL
  int64 size = 4;
  string file_type = 5;
  // Unified file contract (preferred by new clients).
  FileRef file = 6;
}

message DownloadFileRequest {
  string id = 1; // stable id (uuid) or legacy stored filename
}

message DownloadFileResponse {
  bytes chunk = 1;
}
message DeleteFileRequest {
  string id = 1;
  int64 user_id = 2;
}

message DeleteFileResponse {
  bool success = 1;
}