syntax = "proto3";
package admin.v1;
import "validate/validate.proto";

import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/empty.proto";

option go_package = "github.com/lucky720s/diplomaflow/pkg/protobuf/admin/v1";

service AdminService {
  // ==================== Dashboard ====================
  rpc GetDashboard(GetDashboardRequest) returns (GetDashboardResponse);
  rpc GetDepartmentStats(GetDepartmentStatsRequest) returns (GetDepartmentStatsResponse);

  // ==================== Students ====================
  rpc ListStudents(ListStudentsRequest) returns (ListStudentsResponse);
  rpc GetStudent(GetStudentRequest) returns (GetStudentResponse);

  // ==================== Teams ====================
  rpc ListAllTeams(ListAllTeamsRequest) returns (ListAllTeamsResponse);
  rpc GetTeamDetails(GetTeamDetailsRequest) returns (GetTeamDetailsResponse);
  rpc UpdateTeamAdmin(UpdateTeamAdminRequest) returns (UpdateTeamAdminResponse);
  rpc DeleteTeamAdmin(DeleteTeamAdminRequest) returns (google.protobuf.Empty);

  // ==================== Supervisors ====================
  rpc ListSupervisors(ListSupervisorsRequest) returns (ListSupervisorsResponse);
  rpc AssignSupervisor(AssignSupervisorRequest) returns (AssignSupervisorResponse);

  // ==================== Supervisor Request (Запрос команды к руководителю) ====================
  // Команда отправляет запрос супервайзеру стать руководителем
  rpc CreateSupervisorRequest(CreateSupervisorRequestReq) returns (CreateSupervisorRequestResp);
  rpc ListSupervisorRequests(ListSupervisorRequestsReq) returns (ListSupervisorRequestsResp);
  rpc GetSupervisorRequest(GetSupervisorRequestReq) returns (GetSupervisorRequestResp);
  rpc RespondToSupervisorRequest(RespondToSupervisorRequestReq) returns (RespondToSupervisorRequestResp);
  rpc ListMySupervisorRequests(ListMySupervisorRequestsReq) returns (ListMySupervisorRequestsResp);
  rpc CancelSupervisorRequest(CancelSupervisorRequestReq) returns (CancelSupervisorRequestResp);

  // ==================== Topic Registration (Заявление на тему) ====================
  rpc SubmitTopicRegistration(SubmitTopicRegistrationRequest) returns (SubmitTopicRegistrationResponse);
  rpc ListTopicRegistrations(ListTopicRegistrationsRequest) returns (ListTopicRegistrationsResponse);
  rpc ReviewTopicRegistration(ReviewTopicRegistrationRequest) returns (ReviewTopicRegistrationResponse);
  rpc GetTopicRegistration(GetTopicRegistrationRequest) returns (GetTopicRegistrationResponse);

  // ==================== Pre-Defense (Предзащита) ====================
  rpc SubmitPreDefense(SubmitPreDefenseRequest) returns (SubmitPreDefenseResponse);
  rpc ListPreDefenseSubmissions(ListPreDefenseSubmissionsRequest) returns (ListPreDefenseSubmissionsResponse);
  rpc GetPreDefenseSubmission(GetPreDefenseSubmissionRequest) returns (GetPreDefenseSubmissionResponse);
  rpc SchedulePreDefense(SchedulePreDefenseRequest) returns (SchedulePreDefenseResponse);
  rpc GradePreDefense(GradePreDefenseRequest) returns (GradePreDefenseResponse);
  rpc CompletePreDefense(CompletePreDefenseRequest) returns (CompletePreDefenseResponse);
  rpc ReschedulePreDefense(ReschedulePreDefenseRequest) returns (ReschedulePreDefenseResponse);
  rpc ListScheduledPreDefenses(ListScheduledPreDefensesRequest) returns (ListScheduledPreDefensesResponse);
  rpc AddPreDefenseCommissionMember(AddPreDefenseCommissionMemberRequest) returns (AddPreDefenseCommissionMemberResponse);
  rpc RemovePreDefenseCommissionMember(RemovePreDefenseCommissionMemberRequest) returns (RemovePreDefenseCommissionMemberResponse);

  // ==================== Submissions (Отчеты/Документы) ====================
  rpc ListSubmissions(ListSubmissionsRequest) returns (ListSubmissionsResponse);
  rpc GetSubmission(GetSubmissionRequest) returns (GetSubmissionResponse);
  rpc ReviewSubmission(ReviewSubmissionRequest) returns (ReviewSubmissionResponse);

  // ==================== Grading (Оценивание - только баллы) ====================
  rpc GetProjectGrades(GetProjectGradesRequest) returns (GetProjectGradesResponse);
  rpc SetStepGrade(SetStepGradeRequest) returns (SetStepGradeResponse);
  rpc GetGradingHistory(GetGradingHistoryRequest) returns (GetGradingHistoryResponse);

  // ==================== Workflow Progress ====================
  rpc GetWorkflowProgress(GetWorkflowProgressRequest) returns (GetWorkflowProgressResponse);
  rpc ListPendingReviews(ListPendingReviewsRequest) returns (ListPendingReviewsResponse);
}

// ==================== Topic Registration Messages ====================
message TopicRegistrationInfo {
  string id = 1;
  int64 team_id = 2;
  string team_name = 3;
  int64 project_id = 4;
  string proposed_topic = 5;
  string topic_description = 6;
  int64 supervisor_id = 7;
  string supervisor_name = 8;
  int64 submitted_by = 9;
  string submitter_name = 10;
  string status = 11; // pending, approved, rejected, revision_requested
  string rejection_reason = 12;
  string comment = 13;
  google.protobuf.Timestamp submitted_at = 14;
  google.protobuf.Timestamp reviewed_at = 15;
  int64 reviewed_by = 16;
  string reviewer_name = 17;
}

message SubmitTopicRegistrationRequest {
  int64 team_id = 1 [(validate.rules).int64.gt = 0];
  string proposed_topic = 2 [(validate.rules).string.min_len = 5];
  string topic_description = 3;
  int64 supervisor_id = 4 [(validate.rules).int64.gt = 0];
  int64 submitted_by = 5 [(validate.rules).int64.gt = 0];
}

message SubmitTopicRegistrationResponse {
  bool success = 1;
  string registration_id = 2;
  string message = 3;
}

message ListTopicRegistrationsRequest {
  int64 department_id = 1;
  string status = 2; // pending, approved, rejected, all
  int32 page = 3;
  int32 page_size = 4;
}

message ListTopicRegistrationsResponse {
  repeated TopicRegistrationInfo registrations = 1;
  int64 total_count = 2;
}

message ReviewTopicRegistrationRequest {
  string registration_id = 1 [(validate.rules).string.min_len = 1];
  int64 reviewer_id = 2 [(validate.rules).int64.gt = 0];
  string action = 3 [(validate.rules).string = {in: ["approve", "reject", "request_changes"]}];
  string comment = 4;
  string rejection_reason = 5;
}

message ReviewTopicRegistrationResponse {
  bool success = 1;
  string message = 2;
  TopicRegistrationInfo updated_registration = 3;
}

message GetTopicRegistrationRequest {
  string registration_id = 1;
}

message GetTopicRegistrationResponse {
  TopicRegistrationInfo registration = 1;
  repeated TopicRegistrationHistory history = 2;
}

message TopicRegistrationHistory {
  int64 id = 1;
  int64 reviewer_id = 2;
  string reviewer_name = 3;
  string action = 4;
  string comment = 5;
  google.protobuf.Timestamp created_at = 6;
}

// ==================== Dashboard Messages ====================
message GetDashboardRequest {
  int64 department_id = 1;
}

message GetDashboardResponse {
  DashboardStats stats = 1;
  repeated StepProgress step_progress = 2;
  repeated RecentActivity recent_activities = 3;
}

message DashboardStats {
  int32 total_students = 1;
  int32 total_teams = 2;
  int32 total_projects = 3;
  int32 completed_projects = 4;
  int32 pending_reviews = 5;
  int32 active_supervisors = 6;
  int32 pending_topic_registrations = 7;
  int32 pending_supervisor_requests = 8;
  int32 pending_pre_defenses = 9;
  int32 scheduled_pre_defenses = 10;
  int32 pre_defenses_this_week = 11;
}

message StepProgress {
  int64 step_id = 1;
  string step_name = 2;
  string step_type = 3;
  int32 total_teams = 4;
  int32 completed_teams = 5;
  int32 pending_teams = 6;
  int32 rejected_teams = 7;
  float completion_percentage = 8;
}

message RecentActivity {
  int64 id = 1;
  string activity_type = 2;
  string description = 3;
  int64 actor_id = 4;
  string actor_name = 5;
  int64 target_id = 6;
  string target_type = 7;
  google.protobuf.Timestamp created_at = 8;
}

message GetDepartmentStatsRequest {
  int64 department_id = 1;
}

message GetDepartmentStatsResponse {
  DashboardStats stats = 1;
  repeated WorkflowStepStats workflow_stats = 2;
}

message WorkflowStepStats {
  int64 step_id = 1;
  string step_name = 2;
  int32 awaiting_count = 3;
  int32 approved_count = 4;
  int32 rejected_count = 5;
}

// ==================== Students Messages ====================
message ListStudentsRequest {
  int64 department_id = 1;
  int64 university_id = 2;
  string search = 3; // поиск по имени/email
  bool only_without_team = 4;
  int32 page = 5;
  int32 page_size = 6;
}

message ListStudentsResponse {
  repeated StudentInfo students = 1;
  int64 total_count = 2;
}

message StudentInfo {
  int64 id = 1;
  string email = 2;
  string first_name = 3;
  string last_name = 4;
  int64 team_id = 5;
  string team_name = 6;
  int64 project_id = 7;
  string project_title = 8;
  string current_step = 9;
  google.protobuf.Timestamp created_at = 10;
}

message GetStudentRequest {
  int64 student_id = 1;
}

message GetStudentResponse {
  StudentInfo student = 1;
  repeated GradeInfo grades = 2;
  repeated SubmissionPreview submissions = 3;
}

// ==================== Teams Messages ====================
message ListAllTeamsRequest {
  int64 department_id = 1;
  int64 project_id = 2;
  string status = 3; // active, completed, etc.
  string search = 4;
  int32 page = 5;
  int32 page_size = 6;
}

message ListAllTeamsResponse {
  repeated TeamAdminInfo teams = 1;
  int64 total_count = 2;
}

message TeamAdminInfo {
  int64 id = 1;
  string name = 2;
  int64 project_id = 3;
  string project_title = 4;
  string current_step = 5;
  int32 member_count = 6;
  repeated TeamMemberInfo members = 7;
  SupervisorInfo supervisor = 8;
  string status = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
}

message TeamMemberInfo {
  int64 user_id = 1;
  string full_name = 2;
  string email = 3;
  string role = 4; // leader, member
}

message SupervisorInfo {
  int64 id = 1;
  string full_name = 2;
  string email = 3;
  string position = 4; // Senior Lecturer, Professor, etc.
}

message GetTeamDetailsRequest {
  int64 team_id = 1;
}

message GetTeamDetailsResponse {
  TeamAdminInfo team = 1;
  ProjectProgress project_progress = 2;
  repeated GradeInfo grades = 3;
  repeated SubmissionPreview submissions = 4;
}

message ProjectProgress {
  int64 project_id = 1;
  string title = 2;
  string current_state = 3;
  int64 current_step_id = 4;
  repeated StepStatus steps = 5;
}

message StepStatus {
  int64 step_id = 1;
  string step_name = 2;
  string status = 3; // pending, submitted, approved, rejected
  google.protobuf.Timestamp completed_at = 4;
  GradeInfo grade = 5;
}

message UpdateTeamAdminRequest {
  int64 team_id = 1;
  string name = 2;
  int64 supervisor_id = 3;
  repeated int64 member_ids = 4;
}

message UpdateTeamAdminResponse {
  TeamAdminInfo team = 1;
}

message DeleteTeamAdminRequest {
  int64 team_id = 1;
  string reason = 2;
}

// ==================== Supervisors Messages ====================
message ListSupervisorsRequest {
  int64 department_id = 1;
  int64 university_id = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message ListSupervisorsResponse {
  repeated SupervisorDetails supervisors = 1;
  int64 total_count = 2;
}

message SupervisorDetails {
  int64 id = 1;
  string full_name = 2;
  string email = 3;
  string position = 4;
  int32 teams_count = 5;
  int32 max_teams = 6;
  repeated TeamPreview assigned_teams = 7;
}

message TeamPreview {
  int64 id = 1;
  string name = 2;
  string project_title = 3;
}

message AssignSupervisorRequest {
  int64 team_id = 1;
  int64 supervisor_id = 2;
}

message AssignSupervisorResponse {
  bool success = 1;
  string message = 2;
}

// ==================== Supervisor Request Messages ====================

// SupervisorRequest - заявка команды на научного руководителя
message SupervisorRequest {
  string id = 1;
  int64 team_id = 2;
  string team_name = 3;
  int64 project_id = 4;
  int64 supervisor_id = 5;
  string supervisor_name = 6;
  string supervisor_email = 7;
  int64 requested_by = 8;
  string requester_name = 9;
  string status = 10;
  string message = 11;
  string proposed_topic = 12;
  string reject_reason = 13;
  google.protobuf.Timestamp created_at = 14;
  google.protobuf.Timestamp responded_at = 15;
  google.protobuf.Timestamp expires_at = 16;
  repeated TeamMemberPreview team_members = 17;
}

// TeamMemberPreview - краткая информация об участнике команды
message TeamMemberPreview {
  int64 user_id = 1;
  string full_name = 2;
  string email = 3;
  string role = 4;
}

// CreateSupervisorRequestReq - создание запроса команды к супервайзеру
message CreateSupervisorRequestReq {
  int64 team_id = 1 [(validate.rules).int64.gt = 0];
  int64 supervisor_id = 2 [(validate.rules).int64.gt = 0];
  int64 requested_by = 3 [(validate.rules).int64.gt = 0];
  string message = 4 [(validate.rules).string.max_len = 1000];
  string proposed_topic = 5;
}

message CreateSupervisorRequestResp {
  bool success = 1;
  string request_id = 2;
  string message = 3;
  SupervisorRequest request = 4;
}

// ListSupervisorRequestsReq - список запросов (для админки)
message ListSupervisorRequestsReq {
  int64 department_id = 1;
  string status = 2;
  int64 supervisor_id = 3;
  int64 team_id = 4;
  int32 page = 5;
  int32 page_size = 6;
}

message ListSupervisorRequestsResp {
  repeated SupervisorRequest requests = 1;
  int64 total_count = 2;
}

// GetSupervisorRequestReq - получение детального запроса
message GetSupervisorRequestReq {
  string request_id = 1 [(validate.rules).string.min_len = 1];
}

message GetSupervisorRequestResp {
  SupervisorRequest request = 1;
  repeated SupervisorRequestHistory history = 2;
}

// SupervisorRequestHistory - история изменений запроса
message SupervisorRequestHistory {
  int64 id = 1;
  string action = 2;
  int64 actor_id = 3;
  string actor_name = 4;
  string comment = 5;
  google.protobuf.Timestamp created_at = 6;
}

// RespondToSupervisorRequestReq - ответ супервайзера на запрос
message RespondToSupervisorRequestReq {
  string request_id = 1 [(validate.rules).string.min_len = 1];
  int64 supervisor_id = 2 [(validate.rules).int64.gt = 0];
  string action = 3 [(validate.rules).string = {in: ["approve", "reject"]}];
  string reject_reason = 4;
  string comment = 5;
}

message RespondToSupervisorRequestResp {
  bool success = 1;
  string message = 2;
  SupervisorRequest updated_request = 3;
}

// ListMySupervisorRequestsReq - список входящих запросов для супервайзера
message ListMySupervisorRequestsReq {
  int64 supervisor_id = 1 [(validate.rules).int64.gt = 0];
  string status = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message ListMySupervisorRequestsResp {
  repeated SupervisorRequest requests = 1;
  int64 total_count = 2;
  int32 pending_count = 3;
}

// CancelSupervisorRequestReq - отмена запроса командой
message CancelSupervisorRequestReq {
  string request_id = 1 [(validate.rules).string.min_len = 1];
  int64 cancelled_by = 2 [(validate.rules).int64.gt = 0];
  string reason = 3;
}

message CancelSupervisorRequestResp {
  bool success = 1;
  string message = 2;
}

// ==================== Pre-Defense Messages ====================

// PreDefenseSubmission - заявление на предзащиту
message PreDefenseSubmission {
  string id = 1;                                      // UUID заявления
  int64 team_id = 2;                                  // ID команды
  string team_name = 3;                               // Название команды
  int64 project_id = 4;                               // ID проекта
  string project_title = 5;                           // Название проекта
  int64 supervisor_id = 6;                            // ID научного руководителя
  string supervisor_name = 7;                         // ФИО руководителя
  int64 submitted_by = 8;                             // Кто подал заявление
  string submitter_name = 9;                          // ФИО подавшего

  // Статусы: pending, scheduled, in_progress, completed, passed, failed, cancelled
  string status = 10;

  // Информация о предзащите
  google.protobuf.Timestamp scheduled_date = 11;     // Назначенная дата
  string scheduled_time = 12;                         // Время (HH:MM)
  string location = 13;                               // Место проведения (аудитория/онлайн)
  string meeting_link = 14;                           // Ссылка на онлайн-встречу (если онлайн)
  int32 duration_minutes = 15;                        // Длительность в минутах

  // Оценивание (выставляет комиссия)
  int32 grade = 16;                                   // Оценка 0-100 баллов
  string grade_comment = 17;                          // Комментарий к оценке
  int64 graded_by = 18;                               // Кто выставил оценку
  string grader_name = 19;                            // ФИО оценивающего
  google.protobuf.Timestamp graded_at = 20;          // Когда выставлена оценка

  // Результат предзащиты
  string result = 21;                                 // passed, failed, conditional
  string result_comment = 22;                         // Комментарий к результату
  repeated string recommendations = 23;               // Рекомендации комиссии

  // Комиссия
  repeated PreDefenseCommissionMember commission = 24;

  // Документы
  repeated PreDefenseDocument documents = 25;         // Прикреплённые документы

  // Временные метки
  google.protobuf.Timestamp submitted_at = 26;       // Дата подачи заявления
  google.protobuf.Timestamp completed_at = 27;       // Дата завершения
  google.protobuf.Timestamp created_at = 28;
  google.protobuf.Timestamp updated_at = 29;
}

// PreDefenseCommissionMember - член комиссии предзащиты
message PreDefenseCommissionMember {
  int64 id = 1;
  int64 user_id = 2;
  string full_name = 3;
  string email = 4;
  string role = 5;                                    // chairman, member, secretary
  string position = 6;                                // Должность (Professor, etc.)
  bool is_present = 7;                                // Присутствовал ли
  int32 individual_grade = 8;                         // Индивидуальная оценка члена комиссии
  string comment = 9;                                 // Комментарий члена комиссии
}

// PreDefenseDocument - документ для предзащиты
message PreDefenseDocument {
  string id = 1;
  string file_name = 2;
  string file_type = 3;                               // presentation, report, abstract, other
  string display_name = 4;                            // Отображаемое название
  int64 size = 5;
  string download_url = 6;
  int64 uploaded_by = 7;
  google.protobuf.Timestamp uploaded_at = 8;
}

// PreDefenseHistory - история изменений предзащиты
message PreDefenseHistory {
  int64 id = 1;
  string action = 2;                                  // submitted, scheduled, rescheduled, graded, completed, cancelled
  int64 actor_id = 3;
  string actor_name = 4;
  string old_value = 5;
  string new_value = 6;
  string comment = 7;
  google.protobuf.Timestamp created_at = 8;
}

// ==================== Request/Response Messages ====================

// SubmitPreDefenseRequest - подача заявления на предзащиту
message SubmitPreDefenseRequest {
  int64 team_id = 1 [(validate.rules).int64.gt = 0];
  int64 project_id = 2 [(validate.rules).int64.gt = 0];
  int64 submitted_by = 3 [(validate.rules).int64.gt = 0];
  string message = 4;                                 // Сообщение от команды
  repeated string preferred_dates = 5;               // Предпочтительные даты (ISO format)
  repeated string document_ids = 6;                  // ID прикреплённых документов
}

message SubmitPreDefenseResponse {
  bool success = 1;
  string submission_id = 2;
  string message = 3;
  PreDefenseSubmission submission = 4;
}

// ListPreDefenseSubmissionsRequest - список заявлений на предзащиту
message ListPreDefenseSubmissionsRequest {
  int64 department_id = 1;
  string status = 2;
  int64 supervisor_id = 3;
  int64 team_id = 4;
  google.protobuf.Timestamp date_from = 5;
  google.protobuf.Timestamp date_to = 6;
  int32 page = 7;
  int32 page_size = 8;
}

message ListPreDefenseSubmissionsResponse {
  repeated PreDefenseSubmission submissions = 1;
  int64 total_count = 2;
  PreDefenseStats stats = 3;
}

// PreDefenseStats - статистика по предзащитам
message PreDefenseStats {
  int32 pending_count = 1;
  int32 scheduled_count = 2;
  int32 completed_count = 3;
  int32 passed_count = 4;
  int32 failed_count = 5;
}

// GetPreDefenseSubmissionRequest - получение детальной информации
message GetPreDefenseSubmissionRequest {
  string submission_id = 1 [(validate.rules).string.min_len = 1];
}

message GetPreDefenseSubmissionResponse {
  PreDefenseSubmission submission = 1;
  repeated PreDefenseHistory history = 2;
  ProjectProgress project_progress = 3;
  repeated PreDefenseSubmission previous_attempts = 4;
}

// SchedulePreDefenseRequest - назначение даты предзащиты
message SchedulePreDefenseRequest {
  string submission_id = 1 [(validate.rules).string.min_len = 1];
  int64 scheduled_by = 2 [(validate.rules).int64.gt = 0];
  google.protobuf.Timestamp scheduled_date = 3;
  string scheduled_time = 4;
  string location = 5;
  string meeting_link = 6;
  int32 duration_minutes = 7;
  repeated int64 commission_member_ids = 8;
  string comment = 9;
}

message SchedulePreDefenseResponse {
  bool success = 1;
  string message = 2;
  PreDefenseSubmission updated_submission = 3;
}

// GradePreDefenseRequest - выставление оценки за предзащиту (комиссия)
message GradePreDefenseRequest {
  string submission_id = 1 [(validate.rules).string.min_len = 1];
  int64 graded_by = 2 [(validate.rules).int64.gt = 0];
  int32 grade = 3 [(validate.rules).int32 = {gte: 0, lte: 100}];
  string comment = 4;
  repeated CommissionMemberGrade member_grades = 5;
}

// CommissionMemberGrade - оценка от конкретного члена комиссии
message CommissionMemberGrade {
  int64 member_id = 1;
  int32 grade = 2;
  string comment = 3;
}

message GradePreDefenseResponse {
  bool success = 1;
  string message = 2;
  PreDefenseSubmission updated_submission = 3;
}

// CompletePreDefenseRequest - завершение предзащиты с результатом
message CompletePreDefenseRequest {
  string submission_id = 1 [(validate.rules).string.min_len = 1];
  int64 completed_by = 2 [(validate.rules).int64.gt = 0];
  string result = 3 [(validate.rules).string = {in: ["passed", "failed", "conditional"]}];
  string result_comment = 4;
  repeated string recommendations = 5;
  bool allow_resubmission = 6;
}

message CompletePreDefenseResponse {
  bool success = 1;
  string message = 2;
  PreDefenseSubmission updated_submission = 3;
}

// ReschedulePreDefenseRequest - перенос предзащиты
message ReschedulePreDefenseRequest {
  string submission_id = 1 [(validate.rules).string.min_len = 1];
  int64 rescheduled_by = 2 [(validate.rules).int64.gt = 0];
  google.protobuf.Timestamp new_date = 3;
  string new_time = 4;
  string new_location = 5;
  string reason = 6;
}

message ReschedulePreDefenseResponse {
  bool success = 1;
  string message = 2;
  PreDefenseSubmission updated_submission = 3;
}

// ListScheduledPreDefensesRequest - список назначенных предзащит (для календаря)
message ListScheduledPreDefensesRequest {
  int64 department_id = 1;
  google.protobuf.Timestamp date_from = 2;
  google.protobuf.Timestamp date_to = 3;
  int64 commission_member_id = 4;
  string location = 5;
}

message ListScheduledPreDefensesResponse {
  repeated PreDefenseScheduleItem schedule = 1;
  int32 total_count = 2;
}

// PreDefenseScheduleItem - элемент расписания
message PreDefenseScheduleItem {
  string submission_id = 1;
  int64 team_id = 2;
  string team_name = 3;
  string project_title = 4;
  string supervisor_name = 5;
  google.protobuf.Timestamp scheduled_date = 6;
  string scheduled_time = 7;
  string location = 8;
  int32 duration_minutes = 9;
  string status = 10;
  repeated string commission_member_names = 11;
}

// AddPreDefenseCommissionMemberRequest - добавление члена комиссии
message AddPreDefenseCommissionMemberRequest {
  string submission_id = 1 [(validate.rules).string.min_len = 1];
  int64 user_id = 2 [(validate.rules).int64.gt = 0];
  string role = 3 [(validate.rules).string = {in: ["chairman", "member", "secretary"]}];
  int64 added_by = 4;
}

message AddPreDefenseCommissionMemberResponse {
  bool success = 1;
  string message = 2;
  PreDefenseCommissionMember member = 3;
}

// RemovePreDefenseCommissionMemberRequest - удаление члена комиссии
message RemovePreDefenseCommissionMemberRequest {
  string submission_id = 1 [(validate.rules).string.min_len = 1];
  int64 user_id = 2 [(validate.rules).int64.gt = 0];
  int64 removed_by = 3;
  string reason = 4;
}

message RemovePreDefenseCommissionMemberResponse {
  bool success = 1;
  string message = 2;
}


// ==================== Submissions Messages ====================
message ListSubmissionsRequest {
  int64 department_id = 1;
  int64 step_id = 2;
  string status = 3; // pending, approved, rejected, all
  int64 team_id = 4;
  int32 page = 5;
  int32 page_size = 6;
}

message ListSubmissionsResponse {
  repeated SubmissionInfo submissions = 1;
  int64 total_count = 2;
}

message SubmissionInfo {
  string id = 1;
  int64 project_id = 2;
  string project_title = 3;
  int64 team_id = 4;
  string team_name = 5;
  int64 step_id = 6;
  string step_name = 7;
  int64 submitted_by = 8;
  string submitter_name = 9;
  string status = 10; // pending, approved, rejected
  google.protobuf.Struct data = 11;
  repeated FileAttachment files = 12;
  google.protobuf.Timestamp submitted_at = 13;
  ReviewInfo review = 14;
}

message SubmissionPreview {
  string id = 1;
  string step_name = 2;
  string status = 3;
  google.protobuf.Timestamp submitted_at = 4;
}

message FileAttachment {
  string id = 1;
  string file_name = 2;
  string file_type = 3;
  int64 size = 4;
  string download_url = 5;
}

message ReviewInfo {
  int64 reviewer_id = 1;
  string reviewer_name = 2;
  string status = 3;
  string comment = 4;
  google.protobuf.Timestamp reviewed_at = 5;
}

message GetSubmissionRequest {
  string submission_id = 1;
}

message GetSubmissionResponse {
  SubmissionInfo submission = 1;
  repeated ReviewHistory history = 2;
}

message ReviewHistory {
  int64 id = 1;
  int64 reviewer_id = 2;
  string reviewer_name = 3;
  string action = 4; // submitted, approved, rejected, requested_changes
  string comment = 5;
  google.protobuf.Timestamp created_at = 6;
}

message ReviewSubmissionRequest {
  string submission_id = 1 [(validate.rules).string.min_len = 1];
  int64 reviewer_id = 2 [(validate.rules).int64.gt = 0];
  string action = 3 [(validate.rules).string = {in: ["approve", "reject", "request_changes"]}];
  string comment = 4;
  int32 grade = 5 [(validate.rules).int32 = {gte: 0, lte: 100}];
}

message ReviewSubmissionResponse {
  bool success = 1;
  string message = 2;
  SubmissionInfo updated_submission = 3;
}

// ==================== Grading Messages ====================
message GradeInfo {
  int64 id = 1;
  int64 project_id = 2;
  int64 step_id = 3;
  string step_name = 4;
  int32 grade = 5; // 0-100 баллов
  int64 graded_by = 6;
  string grader_name = 7;
  string comment = 8;
  google.protobuf.Timestamp graded_at = 9;
}

message GetProjectGradesRequest {
  int64 project_id = 1;
}

message GetProjectGradesResponse {
  int64 project_id = 1;
  string project_title = 2;
  int64 team_id = 3;
  string team_name = 4;
  repeated GradeInfo step_grades = 5;
  float average_grade = 6;
  float total_score = 7;
}

message SetStepGradeRequest {
  int64 project_id = 1;
  int64 step_id = 2;
  int32 grade = 3 [(validate.rules).int32 = {gte: 0, lte: 100}]; // 0-100
  string comment = 4;
  int64 grader_id = 5;
}

message SetStepGradeResponse {
  bool success = 1;
  GradeInfo grade = 2;
}

message GetGradingHistoryRequest {
  int64 project_id = 1;
  int64 step_id = 2;
}

message GetGradingHistoryResponse {
  repeated GradeHistoryItem history = 1;
}

message GradeHistoryItem {
  int64 id = 1;
  int32 old_grade = 2;
  int32 new_grade = 3;
  int64 changed_by = 4;
  string changer_name = 5;
  string reason = 6;
  google.protobuf.Timestamp changed_at = 7;
}


// ==================== Workflow Progress Messages ====================
message GetWorkflowProgressRequest {
  int64 department_id = 1;
  int64 workflow_id = 2;
}

message GetWorkflowProgressResponse {
  int64 workflow_id = 1;
  string workflow_name = 2;
  repeated StepProgress steps = 3;
}

message ListPendingReviewsRequest {
  int64 department_id = 1;
  int64 reviewer_id = 2; // optional - для конкретного проверяющего
  int64 step_id = 3; // optional - для конкретного этапа
  int32 page = 4;
  int32 page_size = 5;
}

message ListPendingReviewsResponse {
  repeated PendingReview reviews = 1;
  int64 total_count = 2;
}

message PendingReview {
  string submission_id = 1;
  int64 project_id = 2;
  string project_title = 3;
  int64 team_id = 4;
  string team_name = 5;
  int64 step_id = 6;
  string step_name = 7;
  google.protobuf.Timestamp submitted_at = 8;
  int32 days_pending = 9;
  string priority = 10; // low, medium, high, urgent
}
