syntax = "proto3";

package university.v1;
import "google/protobuf/field_mask.proto";
option go_package = "github.com/lucky720s/diplomaflow/pkg/protobuf/university/v1";

service UniversityService{
  rpc CreateUniversity(CreateUniversityRequest) returns (CreateUniversityResponse);
  rpc GetUniversity(GetUniversityRequest) returns (GetUniversityResponse);
  rpc ListUniversities(ListUniversitiesRequest) returns (ListUniversitiesResponse);
  rpc UpdateUniversity(UpdateUniversityRequest) returns (UpdateUniversityResponse);
  rpc DeleteUniversity(DeleteUniversityRequest) returns (DeleteUniversityResponse);
  rpc CreateDepartment(CreateDepartmentRequest) returns (CreateDepartmentResponse);
  rpc GetDepartment(GetDepartmentRequest) returns (GetDepartmentResponse);
  rpc ListDepartments(ListDepartmentsRequest) returns (ListDepartmentsResponse);
  rpc UpdateDepartment(UpdateDepartmentRequest) returns (UpdateDepartmentResponse);
  rpc DeleteDepartment(DeleteDepartmentRequest) returns (DeleteDepartmentResponse);
}

message University{
  int64 id = 1;
  string name = 2;
  string short_name = 3;
}
message Department{
  int64 id = 1;
  string name = 2;
  int64 university_id = 3;
}
message CreateUniversityRequest{
  string name = 1;
  string short_name = 2;
}
message CreateUniversityResponse{
  University university = 1;
}
message GetUniversityRequest{
  int64 university_id = 1;
}
message GetUniversityResponse{
  University university = 1;
}

message ListUniversitiesRequest{}
message ListUniversitiesResponse{
  repeated University universities = 1;
}
message UpdateUniversityRequest{
  University university = 1;
  google.protobuf.FieldMask update_mask = 2;
}
message UpdateUniversityResponse{
  University university = 1;
}
message DeleteUniversityRequest{
  int64 university_id = 1;
}
message DeleteUniversityResponse{
  bool success = 1;
}
message CreateDepartmentRequest{
  string name = 1;
  int64 university_id = 2;
}
message CreateDepartmentResponse{
  Department department = 1;
}
message GetDepartmentRequest{
  int64 department_id = 1;
}
message GetDepartmentResponse{
  Department department = 1;
}
message ListDepartmentsRequest{
  int64 university_id = 1;
}
message ListDepartmentsResponse{
  repeated Department departments = 1;
}
message UpdateDepartmentRequest{
  Department department = 1;
  google.protobuf.FieldMask update_mask = 2;
}
message UpdateDepartmentResponse{
  Department department = 1;
}
message DeleteDepartmentRequest{
  int64 department_id = 1;
}
message DeleteDepartmentResponse{
  bool success = 1;
}