syntax = "proto3";
package workflow.v1;
import "google/protobuf/struct.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
option go_package = "github.com/lucky720s/diplomaflow/pkg/protobuf/workflow/v1";
// ==================== ENUMS ====================
enum StateType {
  STATE_TYPE_UNSPECIFIED = 0;
  TEAM_FORMATION = 1;
  SUPERVISOR_SELECTION = 2;
  TOPIC_APPROVAL = 3;
  DOCUMENT_UPLOAD = 4;
  FORM_SUBMIT = 5;
  EXTERNAL_CHECK = 6;
  REVIEW = 7;
  APPROVAL = 8;
  DEFENSE = 9;
  MILESTONE = 10;
  GRADING = 11;
  COMPLETED = 12;
}
enum ActionType {
  ACTION_TYPE_UNSPECIFIED = 0;
  SEND_NOTIFICATION = 1;
  SEND_EMAIL = 2;
  ASSIGN_TASK = 3;
  CALL_WEBHOOK = 4;
  CREATE_SUBMISSION = 5;
  UPDATE_PROJECT = 6;
  SCHEDULE_REMINDER = 7;
  VALIDATE_DATA = 8;
  CALCULATE_GRADE = 9;
  GENERATE_DOCUMENT = 10;
  EXTERNAL_API = 11;
}
enum ActionTrigger {
  TRIGGER_UNSPECIFIED = 0;
  ON_ENTER = 1;
  ON_EXIT = 2;
  ON_DEADLINE = 3;
  ON_UPDATE = 4;
  ON_CONDITION = 5;
  SCHEDULED = 6;
}
// ==================== MESSAGES ====================
message Workflow {
  int64 id = 1;
  string name = 2;
  string description = 3;
  int64 department_id = 4;
  int32 version = 5;
  bool is_active = 6;
  bool is_template = 7;
  int64 parent_id = 8;
  google.protobuf.Struct settings = 9;
  repeated State states = 10;
  repeated Transition transitions = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp updated_at = 13;
}
message WorkflowSettings {
  bool team_required = 1;
  int32 min_team_size = 2;
  int32 max_team_size = 3;
  bool allow_solo_project = 4;
  string academic_year = 5;
  string start_date = 6;
  string end_date = 7;
  string timezone = 8;
  repeated int32 deadline_warning_days = 9;
  repeated string required_roles = 10;
  repeated string allowed_file_types = 11;
}
message State {
  int64 id = 1;
  int64 workflow_id = 2;
  string name = 3;
  string display_name = 4;
  string description = 5;
  int32 order_index = 6;
  StateType type = 7;
  bool is_initial = 8;
  bool is_final = 9;
  bool is_optional = 10;
  google.protobuf.Struct config = 11;
  int32 duration_days = 12;
  string duration_mode = 13;
  google.protobuf.Timestamp fixed_deadline = 14;
  string color = 15;
  string icon = 16;
  repeated StateAction actions = 17;
  repeated Transition outgoing_transitions = 18;
}
message Transition {
  int64 id = 1;
  int64 workflow_id = 2;
  string event_name = 3;
  string display_name = 4;
  int64 from_state_id = 5;
  int64 to_state_id = 6;
  repeated TransitionCondition conditions = 7;
  string button_label = 8;
  string button_color = 9;
  string confirm_text = 10;
}
message TransitionCondition {
  string type = 1;
  string field = 2;
  string operator = 3;
  google.protobuf.Value value = 4;
}
message StateAction {
  int64 id = 1;
  int64 state_id = 2;
  string name = 3;
  ActionType type = 4;
  ActionTrigger trigger = 5;
  int32 order_index = 6;
  google.protobuf.Struct config = 7;
  bool is_enabled = 8;
  repeated TransitionCondition conditions = 9;
}
// ==================== SERVICE ====================
service WorkflowService {
  // === WORKFLOW CRUD ===
  rpc CreateWorkflow(CreateWorkflowRequest) returns (Workflow);
  rpc GetWorkflow(GetWorkflowRequest) returns (Workflow);
  rpc GetWorkflowFull(GetWorkflowFullRequest) returns (WorkflowFull);
  rpc ListWorkflows(ListWorkflowsRequest) returns (ListWorkflowsResponse);
  rpc UpdateWorkflow(UpdateWorkflowRequest) returns (Workflow);
  rpc DeleteWorkflow(DeleteWorkflowRequest) returns (google.protobuf.Empty);
  // === WORKFLOW MANAGEMENT ===
  rpc SetActiveWorkflow(SetActiveWorkflowRequest) returns (Workflow);
  rpc GetActiveWorkflowByDepartment(GetActiveWorkflowByDepartmentRequest) returns (Workflow);
  rpc CloneWorkflow(CloneWorkflowRequest) returns (Workflow);
  rpc CreateNewVersion(CreateNewVersionRequest) returns (Workflow);
  rpc ValidateWorkflow(ValidateWorkflowRequest) returns (ValidateWorkflowResponse);
  // === STATE CRUD ===
  rpc CreateState(CreateStateRequest) returns (State);
  rpc GetState(GetStateRequest) returns (State);
  rpc ListStates(ListStatesRequest) returns (ListStatesResponse);
  rpc UpdateState(UpdateStateRequest) returns (State);
  rpc DeleteState(DeleteStateRequest) returns (google.protobuf.Empty);
  rpc ReorderStates(ReorderStatesRequest) returns (ListStatesResponse);
  // === TRANSITION CRUD ===
  rpc CreateTransition(CreateTransitionRequest) returns (Transition);
  rpc UpdateTransition(UpdateTransitionRequest) returns (Transition);
  rpc DeleteTransition(DeleteTransitionRequest) returns (google.protobuf.Empty);
  rpc ListTransitions(ListTransitionsRequest) returns (ListTransitionsResponse);
  // === ACTION CRUD ===
  rpc CreateStateAction(CreateStateActionRequest) returns (StateAction);
  rpc UpdateStateAction(UpdateStateActionRequest) returns (StateAction);
  rpc DeleteStateAction(DeleteStateActionRequest) returns (google.protobuf.Empty);
  rpc ListStateActions(ListStateActionsRequest) returns (ListStateActionsResponse);
  // === RUNTIME ===
  rpc GetNextState(GetNextStateRequest) returns (State);
  rpc GetAvailableTransitions(GetAvailableTransitionsRequest) returns (GetAvailableTransitionsResponse);
  rpc GetStepConfiguration(GetStepConfigurationRequest) returns (StepConfiguration);
  rpc ExecuteTransition(ExecuteTransitionRequest) returns (ExecuteTransitionResponse);
  // === TEMPLATES ===
  rpc ListTemplates(ListTemplatesRequest) returns (ListTemplatesResponse);
  rpc CreateFromTemplate(CreateFromTemplateRequest) returns (Workflow);
  rpc GetTeamConfiguration(GetTeamConfigurationRequest) returns (TeamConfigurationResponse);
  rpc CanExecuteTransition(CanExecuteTransitionRequest) returns (CanExecuteTransitionResponse);
  rpc GetDepartmentWorkflowConfig(GetDepartmentWorkflowConfigRequest) returns (DepartmentWorkflowConfigResponse);
}
// ==================== REQUEST/RESPONSE ====================
message CloneWorkflowRequest {
  int64 source_workflow_id = 1;
  int64 target_department_id = 2;
  string new_name = 3;
  bool clone_as_template = 4;
}
message CreateNewVersionRequest {
  int64 workflow_id = 1;
  string changelog = 2;
}
message ValidateWorkflowRequest {
  int64 workflow_id = 1;
}
message ValidateWorkflowResponse {
  bool is_valid = 1;
  repeated ValidationError errors = 2;
  repeated ValidationWarning warnings = 3;
}
message ValidationError {
  string code = 1;
  string message = 2;
  string path = 3;  // "states[0].transitions[1]"
}
message ValidationWarning {
  string code = 1;
  string message = 2;
  string path = 3;
}
message ReorderStatesRequest {
  int64 workflow_id = 1;
  repeated int64 state_ids = 2;  // Новый порядок ID
}
message GetAvailableTransitionsRequest {
  int64 project_id = 1;
  int64 current_state_id = 2;
  int64 user_id = 3;
  string user_role = 4;
}
message GetAvailableTransitionsResponse {
  repeated AvailableTransition transitions = 1;
}
message AvailableTransition {
  Transition transition = 1;
  bool can_execute = 2;
  string blocked_reason = 3;
  repeated string missing_requirements = 4;
}
message ExecuteTransitionRequest {
  int64 project_id = 1;
  int64 transition_id = 2;
  int64 user_id = 3;
  google.protobuf.Struct payload = 4;
}
message ExecuteTransitionResponse {
  bool success = 1;
  int64 new_state_id = 2;
  string new_state_name = 3;
  repeated string executed_actions = 4;
  string error_message = 5;
}
message WorkflowFull {
  Workflow workflow = 1;
  repeated State states = 2;
  repeated Transition transitions = 3;
  WorkflowStats stats = 4;
}
message WorkflowStats {
  int32 total_projects = 1;
  int32 active_projects = 2;
  int32 completed_projects = 3;
  map<string, int32> projects_by_state = 4;
}
message CreateStateRequest {
  int64 workflow_id = 1;
  string name = 2;
  string display_name = 3;
  string description = 4;
  StateType type = 5;
  google.protobuf.Struct config = 6;
  int32 duration_days = 7;
  bool is_initial = 8;
  bool is_final = 9;
  bool is_optional = 10;
  int32 order_index = 11;
}
message UpdateStateRequest {
  int64 id = 1;
  string name = 2;
  string display_name = 3;
  string description = 4;
  google.protobuf.Struct config = 5;
  int32 duration_days = 6;
  bool is_optional = 7;
  int32 order_index = 8;
}
// ... (остальные request/response messages)
message GetWorkflowRequest {
  oneof criteria {
    int64 workflow_id = 1;
    string workflow_name = 2;
  }
}
message ListWorkflowsRequest {
  int64 department_id = 1;
  bool only_active = 2;
  bool include_templates = 3;
}
message ListWorkflowsResponse {
  repeated Workflow workflows = 1;
}
message CreateWorkflowRequest {
  string name = 1;
  string description = 2;
  int64 department_id = 3;
  google.protobuf.Struct settings = 4;
}
message GetWorkflowFullRequest {
  int64 workflow_id = 1;
}
message UpdateWorkflowRequest {
  int64 id = 1;
  string name = 2;
  string description = 3;
  google.protobuf.Struct settings = 4;
}
message DeleteWorkflowRequest {
  int64 workflow_id = 1;
}
message SetActiveWorkflowRequest {
  int64 workflow_id = 1;
}
message GetActiveWorkflowByDepartmentRequest {
  int64 department_id = 1;
}
message GetStateRequest {
  int64 state_id = 1;
}
message ListStatesRequest {
  int64 workflow_id = 1;
}
message ListStatesResponse {
  repeated State states = 1;
}
message DeleteStateRequest {
  int64 state_id = 1;
}
message CreateTransitionRequest {
  int64 workflow_id = 1;
  string event_name = 2;
  string display_name = 3;
  int64 from_state_id = 4;
  int64 to_state_id = 5;
  string button_label = 6;
  string button_color = 7;
  string confirm_text = 8;
}
message UpdateTransitionRequest {
  int64 id = 1;
  string display_name = 2;
  string button_label = 3;
  string button_color = 4;
  string confirm_text = 5;
}
message DeleteTransitionRequest {
  int64 transition_id = 1;
}
message ListTransitionsRequest {
  int64 workflow_id = 1;
}
message ListTransitionsResponse {
  repeated Transition transitions = 1;
}
message CreateStateActionRequest {
  int64 state_id = 1;
  string name = 2;
  ActionType type = 3;
  ActionTrigger trigger = 4;
  int32 order_index = 5;
  google.protobuf.Struct config = 6;
  bool is_enabled = 7;
}
message UpdateStateActionRequest {
  int64 id = 1;
  string name = 2;
  google.protobuf.Struct config = 3;
  int32 order_index = 4;
  bool is_enabled = 5;
}
message DeleteStateActionRequest {
  int64 action_id = 1;
}
message ListStateActionsRequest {
  int64 state_id = 1;
}
message ListStateActionsResponse {
  repeated StateAction actions = 1;
}
message GetNextStateRequest {
  int64 current_state_id = 1;
  string event_name = 2;
}
message GetStepConfigurationRequest {
  int64 state_id = 1;
  int64 project_id = 2;
}
message StepConfiguration {
  int64 state_id = 1;
  string state_name = 2;
  StateType state_type = 3;
  int32 duration_days = 4;
  TeamConfig team_config = 5;
  FileConfig file_config = 6;
  FormConfig form_config = 7;
  ReviewConfig review_config = 8;
}
message TeamConfig {
  int32 min_size = 1;
  int32 max_size = 2;
  bool allow_solo = 3;
  bool require_leader = 4;
}
message FileConfig {
  int32 max_files = 1;
  int64 max_size_bytes = 2;
  repeated string allowed_extensions = 3;
}
message FormConfig {
  string form_id = 1;
  google.protobuf.Struct json_schema = 2;
}
message ReviewConfig {
  repeated string reviewer_roles = 1;
  int32 min_reviewers = 2;
  bool require_comment = 3;
}
message ListTemplatesRequest {
  string category = 1;
}
message ListTemplatesResponse {
  repeated WorkflowTemplate templates = 1;
}
message WorkflowTemplate {
  int64 id = 1;
  string name = 2;
  string description = 3;
  string category = 4;
  bool is_system = 5;
}
message CreateFromTemplateRequest {
  int64 template_id = 1;
  int64 department_id = 2;
  string name = 3;
}
// Visualization messages
message GetWorkflowVisualizationRequest {
  int64 workflow_id = 1;
}
message WorkflowVisualization {
  repeated VisualizationNode nodes = 1;
  repeated VisualizationEdge edges = 2;
}
message VisualizationNode {
  string id = 1;
  string label = 2;
  string type = 3;
  string color = 4;
  Position position = 5;
  map<string, string> data = 6;
}
message VisualizationEdge {
  string id = 1;
  string source = 2;
  string target = 3;
  string label = 4;
  string type = 5;
  bool animated = 6;
}
message Position {
  float x = 1;
  float y = 2;
}
message GetTeamConfigurationRequest {
  int64 department_id = 1;
  int64 workflow_id = 2;        // optional, if 0 - use active workflow
  int64 state_id = 3;           // optional, if 0 - use initial state
}
message TeamConfigurationResponse {
  TeamConfig team_config = 1;
  int64 workflow_id = 2;
  int64 state_id = 3;
  string state_name = 4;
  int32 invite_expire_days = 5;
  bool team_step_required = 6;  // Требуется ли этап формирования команды
}
message CanExecuteTransitionRequest {
  int64 project_id = 1;
  int64 current_state_id = 2;
  int64 transition_id = 3;
  int64 user_id = 4;
  string user_role = 5;
  google.protobuf.Struct project_data = 6;
}
message CanExecuteTransitionResponse {
  bool can_execute = 1;
  string blocked_reason = 2;
  repeated string missing_requirements = 3;
  repeated RequiredAction required_actions = 4;
}
message RequiredAction {
  string action_type = 1;
  string description = 2;
  string link = 3;
}
message GetDepartmentWorkflowConfigRequest {
  int64 department_id = 1;
  string academic_year = 2;     // optional, default current year
}
message DepartmentWorkflowConfigResponse {
  int64 workflow_id = 1;
  string workflow_name = 2;
  TeamConfig team_config = 3;
  repeated StateConfig states = 4;
  repeated DeadlineConfig deadlines = 5;
  google.protobuf.Struct settings = 6;
}
message StateConfig {
  int64 id = 1;
  string name = 2;
  string display_name = 3;
  StateType type = 4;
  int32 order_index = 5;
  google.protobuf.Struct config = 6;
  google.protobuf.Timestamp deadline = 7;
  int32 duration_days = 8;
}
message DeadlineConfig {
  int64 state_id = 1;
  string state_name = 2;
  google.protobuf.Timestamp fixed_deadline = 3;
  int32 relative_days = 4;
}