version: '3.8'
services:
  app:
    build: .
    container_name: diplomaflow_app
    ports:
      - "8080:8080"
    environment:
      - POSTGRES_URL=postgres://postgres:password@db:5432/diplomaflow?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    container_name: diplomaflow_db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=diplomaflow
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d diplomaflow"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
