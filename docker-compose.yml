name: diplomaflow

x-common-env: &common_env
  ENV: ${ENV:-production}
  DATABASE_DSN: ${DATABASE_DSN:?DATABASE_DSN is required}

x-service-addrs-host: &svc_addrs_host
  SERVICES_AUTH_ADDR: 127.0.0.1:8082
  SERVICES_UNIVERSITY_ADDR: 127.0.0.1:8081
  SERVICES_PROJECT_ADDR: 127.0.0.1:8083
  SERVICES_TEAM_ADDR: 127.0.0.1:8084
  SERVICES_WORKFLOW_ADDR: 127.0.0.1:8085
  SERVICES_NOTIFICATION_ADDR: 127.0.0.1:8087
  SERVICES_FILE_ADDR: 127.0.0.1:8088
  SERVICES_FORM_ADDR: 127.0.0.1:8089
  SERVICES_ADMIN_ADDR: 127.0.0.1:8090
  SERVICES_TASK_ADDR: 127.0.0.1:8091

# ============================================================
# Лимит логов — предотвращает рост /var/lib/docker/containers/
# Максимум 30 МБ на сервис (3 файла × 10 МБ)
# ============================================================
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  main_postgres:
    image: postgres:16-alpine
    network_mode: host
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-diplomaflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-diplomaflow}
      PGPORT: "5433"
    command: -p 5433
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -h 127.0.0.1 -p 5433"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    network_mode: host
    logging: *default-logging
    command: redis-server --port 6380
    healthcheck:
      test: ["CMD", "redis-cli", "-h", "127.0.0.1", "-p", "6380", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: cmd/migrate/Dockerfile
    network_mode: host
    logging: *default-logging
    depends_on:
      main_postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-diplomaflow}:${POSTGRES_PASSWORD}@127.0.0.1:5433/${POSTGRES_DB:-diplomaflow}?sslmode=disable
    command: ["-cmd=up", "-path=file:///app/db/migrations"]
    restart: "no"

  api_gateway:
    build:
      context: .
      dockerfile: cmd/api_gateway/Dockerfile
    network_mode: host
    logging: *default-logging
    environment:
      ENV: ${ENV:-production}
      PORT: "8080"
      REDIS_ADDR: 127.0.0.1:6380
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      METRICS_PORT: ${METRICS_PORT:-9091}
      <<: *svc_addrs_host
    depends_on:
      redis:
        condition: service_healthy
      auth_service:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null 2>&1"]
      interval: 10s
      timeout: 3s
      retries: 15
      start_period: 10s
    restart: unless-stopped

  university_service:
    build:
      context: .
      dockerfile: cmd/university_service/Dockerfile
    network_mode: host
    logging: *default-logging
    environment:
      <<: *common_env
      GRPC_PORT: "8081"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=127.0.0.1:8081", "-service=university.v1.UniversityService"]
      interval: 10s
      timeout: 3s
      retries: 15
      start_period: 20s
    restart: unless-stopped

  auth_service:
    build:
      context: .
      dockerfile: cmd/auth_service/Dockerfile
    network_mode: host
    logging: *default-logging
    environment:
      <<: *common_env
      GRPC_PORT: "8082"
      REDIS_ADDR: 127.0.0.1:6380
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-24h}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-720h}
      SERVICES_UNIVERSITY_ADDR: 127.0.0.1:8081
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      university_service:
        condition: service_started
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=127.0.0.1:8082", "-service=auth.v1.AuthService"]
      interval: 10s
      timeout: 3s
      retries: 15
      start_period: 20s
    restart: unless-stopped

  notification_service:
    build:
      context: .
      dockerfile: cmd/notification_service/Dockerfile
    network_mode: host
    logging: *default-logging
    environment:
      <<: *common_env
      GRPC_PORT: "8087"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=127.0.0.1:8087", "-service=notification.v1.NotificationService"]
      interval: 10s
      timeout: 3s
      retries: 15
      start_period: 20s
    restart: unless-stopped

  workflow_service:
    build:
      context: .
      dockerfile: cmd/workflow_service/Dockerfile
    network_mode: host
    logging: *default-logging
    environment:
      <<: *common_env
      GRPC_PORT: "8085"
      SERVICES_NOTIFICATION_ADDR: 127.0.0.1:8087
      SERVICES_PROJECT_ADDR: 127.0.0.1:8083
      SERVICES_TEAM_ADDR: 127.0.0.1:8084
    depends_on:
      migrate:
        condition: service_completed_successfully
      notification_service:
        condition: service_started
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=127.0.0.1:8085", "-service=workflow.v1.WorkflowService"]
      interval: 10s
      timeout: 3s
      retries: 15
      start_period: 20s
    restart: unless-stopped

  project_service:
    build:
      context: .
      dockerfile: cmd/project_service/Dockerfile
    network_mode: host
    logging: *default-logging
    environment:
      <<: *common_env
      GRPC_PORT: "8083"
      SERVICES_WORKFLOW_ADDR: 127.0.0.1:8085
      SERVICES_NOTIFICATION_ADDR: 127.0.0.1:8087
    depends_on:
      migrate:
        condition: service_completed_successfully
      workflow_service:
        condition: service_started
      notification_service:
        condition: service_started
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=127.0.0.1:8083", "-service=project.v1.ProjectService"]
      interval: 10s
      timeout: 3s
      retries: 15
      start_period: 20s
    restart: unless-stopped

  team_service:
    build:
      context: .
      dockerfile: cmd/team_service/Dockerfile
    network_mode: host
    logging: *default-logging
    environment:
      <<: *common_env
      GRPC_PORT: "8084"
      SERVICES_AUTH_ADDR: 127.0.0.1:8082
      SERVICES_WORKFLOW_ADDR: 127.0.0.1:8085
      SERVICES_NOTIFICATION_ADDR: 127.0.0.1:8087
    depends_on:
      migrate:
        condition: service_completed_successfully
      auth_service:
        condition: service_started
      workflow_service:
        condition: service_started
      notification_service:
        condition: service_started
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=127.0.0.1:8084", "-service=team.v1.TeamService"]
      interval: 10s
      timeout: 3s
      retries: 15
      start_period: 20s
    restart: unless-stopped

  file_service:
    build:
      context: .
      dockerfile: cmd/file_service/Dockerfile
    network_mode: host
    logging: *default-logging
    environment:
      <<: *common_env
      GRPC_PORT: "8088"
      STORAGE_PATH: "/uploads"
    volumes:
      - file_uploads:/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=127.0.0.1:8088", "-service=file.v1.FileService"]
      interval: 10s
      timeout: 3s
      retries: 15
      start_period: 20s
    restart: unless-stopped

  form_service:
    build:
      context: .
      dockerfile: cmd/form_service/Dockerfile
    network_mode: host
    logging: *default-logging
    environment:
      <<: *common_env
      GRPC_PORT: "8089"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=127.0.0.1:8089", "-service=form.v1.FormService"]
      interval: 10s
      timeout: 3s
      retries: 15
      start_period: 20s
    restart: unless-stopped

  admin_service:
    build:
      context: .
      dockerfile: cmd/admin_service/Dockerfile
    network_mode: host
    logging: *default-logging
    environment:
      <<: *common_env
      GRPC_PORT: "8090"
      SERVICES_AUTH_ADDR: 127.0.0.1:8082
      SERVICES_PROJECT_ADDR: 127.0.0.1:8083
      SERVICES_TEAM_ADDR: 127.0.0.1:8084
      SERVICES_WORKFLOW_ADDR: 127.0.0.1:8085
    depends_on:
      migrate:
        condition: service_completed_successfully
      auth_service:
        condition: service_started
      project_service:
        condition: service_started
      team_service:
        condition: service_started
      workflow_service:
        condition: service_started
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=127.0.0.1:8090", "-service=admin.v1.AdminService"]
      interval: 10s
      timeout: 3s
      retries: 15
      start_period: 20s
    restart: unless-stopped

  task_service:
    build:
      context: .
      dockerfile: cmd/task_service/Dockerfile
    network_mode: host
    logging: *default-logging
    environment:
      <<: *common_env
      GRPC_PORT: "8091"
      SERVICES_AUTH_ADDR: 127.0.0.1:8082
      SERVICES_TEAM_ADDR: 127.0.0.1:8084
      SERVICES_NOTIFICATION_ADDR: 127.0.0.1:8087
      SERVICES_FILE_ADDR: 127.0.0.1:8088
    depends_on:
      migrate:
        condition: service_completed_successfully
      auth_service:
        condition: service_started
      team_service:
        condition: service_started
      notification_service:
        condition: service_started
      file_service:
        condition: service_started
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=127.0.0.1:8091", "-service=task.v1.TaskService"]
      interval: 10s
      timeout: 3s
      retries: 15
      start_period: 20s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    network_mode: host
    logging: *default-logging
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    network_mode: host
    logging: *default-logging
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    restart: unless-stopped

volumes:
  pg_data:
  file_uploads:
  prom_data:
  grafana_data:
