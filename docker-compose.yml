name: diplomaflow

x-common-env: &common_env
  ENV: ${ENV:-production}
  DATABASE_DSN: ${DATABASE_DSN:?DATABASE_DSN is required}

services:
  main_postgres:
    image: postgres:16-alpine
    network_mode: host
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-diplomaflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-diplomaflow}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -h 127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    network_mode: host
    command: redis-server --port 6379
    healthcheck:
      test: ["CMD", "redis-cli", "-h", "127.0.0.1", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    network_mode: host
    environment:
      KAFKA_KRAFT_CLUSTER_ID: ${KAFKA_KRAFT_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@127.0.0.1:29093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      CLUSTER_ID: ${KAFKA_KRAFT_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://127.0.0.1:29092"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server 127.0.0.1:29092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: cmd/migrate/Dockerfile
    network_mode: host
    depends_on:
      main_postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-diplomaflow}:${POSTGRES_PASSWORD}@127.0.0.1:5432/${POSTGRES_DB:-diplomaflow}?sslmode=disable
    command: ["-cmd=up", "-path=file:///app/db/migrations"]
    restart: "no"

  api_gateway:
    build:
      context: .
      dockerfile: cmd/api_gateway/Dockerfile
    network_mode: host
    environment:
      ENV: ${ENV:-production}
      PORT: "8080"
      REDIS_ADDR: 127.0.0.1:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      SERVICES_AUTH_ADDR: 127.0.0.1:8082
      SERVICES_UNIVERSITY_ADDR: 127.0.0.1:8081
      SERVICES_PROJECT_ADDR: 127.0.0.1:8083
      SERVICES_TEAM_ADDR: 127.0.0.1:8084
      SERVICES_WORKFLOW_ADDR: 127.0.0.1:8085
      SERVICES_ROLE_ADDR: 127.0.0.1:8086
      SERVICES_NOTIFICATION_ADDR: 127.0.0.1:8087
      SERVICES_FILE_ADDR: 127.0.0.1:8088
      SERVICES_FORM_ADDR: 127.0.0.1:8089
      SERVICES_ADMIN_ADDR: 127.0.0.1:8090
      SERVICES_TASK_ADDR: 127.0.0.1:8091
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null 2>&1"]
      interval: 10s
      timeout: 3s
      retries: 15
      start_period: 10s
    restart: unless-stopped

  university_service:
    build:
      context: .
      dockerfile: cmd/university_service/Dockerfile
    network_mode: host
    environment:
      <<: *common_env
      GRPC_PORT: "8081"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=127.0.0.1:8081", "-service=university.v1.UniversityService"]
      interval: 10s
      timeout: 3s
      retries: 15
      start_period: 20s
    restart: unless-stopped

  auth_service:
    build:
      context: .
      dockerfile: cmd/auth_service/Dockerfile
    network_mode: host
    environment:
      <<: *common_env
      GRPC_PORT: "8082"
      REDIS_ADDR: 127.0.0.1:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-720h}
      SERVICES_UNIVERSITY_ADDR: 127.0.0.1:8081
      SERVICES_ROLE_ADDR: 127.0.0.1:8086
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=127.0.0.1:8082", "-service=auth.v1.AuthService"]
      interval: 10s
      timeout: 3s
      retries: 15
      start_period: 20s
    restart: unless-stopped

  project_service:
    build:
      context: .
      dockerfile: cmd/project_service/Dockerfile
    network_mode: host
    environment:
      <<: *common_env
      GRPC_PORT: "8083"
      KAFKA_BROKERS: 127.0.0.1:29092
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=127.0.0.1:8083", "-service=project.v1.ProjectService"]
      interval: 10s
      timeout: 3s
      retries: 15
      start_period: 20s
    restart: unless-stopped

  team_service:
    build:
      context: .
      dockerfile: cmd/team_service/Dockerfile
    network_mode: host
    environment:
      <<: *common_env
      GRPC_PORT: "8084"
      KAFKA_BROKERS: 127.0.0.1:29092
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=127.0.0.1:8084", "-service=team.v1.TeamService"]
      interval: 10s
      timeout: 3s
      retries: 15
      start_period: 20s
    restart: unless-stopped

  workflow_service:
    build:
      context: .
      dockerfile: cmd/workflow_service/Dockerfile
    network_mode: host
    environment:
      <<: *common_env
      GRPC_PORT: "8085"
      KAFKA_BROKERS: 127.0.0.1:29092
      KAFKA_GROUP_ID: ${KAFKA_GROUP_ID:-workflow-service-group}
      SERVICES_NOTIFICATION_ADDR: 127.0.0.1:8087
      SERVICES_PROJECT_ADDR: 127.0.0.1:8083
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=127.0.0.1:8085", "-service=workflow.v1.WorkflowService"]
      interval: 10s
      timeout: 3s
      retries: 15
      start_period: 20s
    restart: unless-stopped

  role_service:
    build:
      context: .
      dockerfile: cmd/role_service/Dockerfile
    network_mode: host
    environment:
      <<: *common_env
      GRPC_PORT: "8086"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=127.0.0.1:8086", "-service=role.v1.RoleService"]
      interval: 10s
      timeout: 3s
      retries: 15
      start_period: 20s
    restart: unless-stopped

  notification_service:
    build:
      context: .
      dockerfile: cmd/notification_service/Dockerfile
    network_mode: host
    environment:
      <<: *common_env
      GRPC_PORT: "8087"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=127.0.0.1:8087", "-service=notification.v1.NotificationService"]
      interval: 10s
      timeout: 3s
      retries: 15
      start_period: 20s
    restart: unless-stopped

  file_service:
    build:
      context: .
      dockerfile: cmd/file_service/Dockerfile
    network_mode: host
    environment:
      <<: *common_env
      GRPC_PORT: "8088"
      STORAGE_PATH: "/uploads"
    volumes:
      - file_uploads:/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=127.0.0.1:8088", "-service=file.v1.FileService"]
      interval: 10s
      timeout: 3s
      retries: 15
      start_period: 20s
    restart: unless-stopped

  form_service:
    build:
      context: .
      dockerfile: cmd/form_service/Dockerfile
    network_mode: host
    environment:
      <<: *common_env
      GRPC_PORT: "8089"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=127.0.0.1:8089", "-service=form.v1.FormService"]
      interval: 10s
      timeout: 3s
      retries: 15
      start_period: 20s
    restart: unless-stopped

  admin_service:
    build:
      context: .
      dockerfile: cmd/admin_service/Dockerfile
    network_mode: host
    environment:
      <<: *common_env
      GRPC_PORT: "8090"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=127.0.0.1:8090", "-service=admin.v1.AdminService"]
      interval: 10s
      timeout: 3s
      retries: 15
      start_period: 20s
    restart: unless-stopped

  task_service:
    build:
      context: .
      dockerfile: cmd/task_service/Dockerfile
    network_mode: host
    environment:
      <<: *common_env
      GRPC_PORT: "8091"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=127.0.0.1:8091", "-service=task.v1.TaskService"]
      interval: 10s
      timeout: 3s
      retries: 15
      start_period: 20s
    restart: unless-stopped

volumes:
  pg_data:
  file_uploads:
