version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: diplomaflow
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d diplomaflow"]
      interval: 10s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 15

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  api_gateway:
    container_name: api_gateway
    build:
      context: .
      dockerfile: cmd/api_gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      REDIS_ADDR: "redis:6379"
      AUTH_SERVICE_ADDR: "auth_service:8082"
      UNIVERSITY_SERVICE_ADDR: "university_service:8081"
      PROJECT_SERVICE_ADDR: "project_service:8083"
      TEAM_SERVICE_ADDR: "team_service:8084"
      WORKFLOW_SERVICE_ADDR: "workflow_service:8085"
      ROLE_SERVICE_ADDR: "role_service:8086"
      NOTIFICATION_SERVICE_ADDR: "notification_service:8087"
      FILE_SERVICE_ADDR: "file_service:8088"
      FORM_SERVICE_ADDR: "form_service:8089"
      ADMIN_SERVICE_ADDR: "admin_service:8090"
    depends_on:
      redis:
        condition: service_healthy
      auth_service:
        condition: service_healthy
      university_service:
        condition: service_healthy
      project_service:
        condition: service_healthy
      team_service:
        condition: service_healthy
      workflow_service:
        condition: service_healthy
      role_service:
        condition: service_healthy
      notification_service:
        condition: service_healthy
      file_service:
        condition: service_healthy
      form_service:
        condition: service_healthy
      admin_service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz >/dev/null 2>&1"]
      interval: 10s
      timeout: 3s
      retries: 15
      start_period: 10s

  university_service:
    container_name: university_service
    build:
      context: .
      dockerfile: cmd/university_service/Dockerfile
    ports:
      - "8081:8081"
    environment:
      GRPC_PORT: "8081"
      ENV: "dev"
      DATABASE_DSN: "host=postgres user=postgres password=postgres dbname=diplomaflow port=5432 sslmode=disable TimeZone=UTC"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=localhost:8081", "-service=university.v1.UniversityService"]
      interval: 10s
      timeout: 3s
      retries: 15
      start_period: 15s

  auth_service:
    container_name: auth_service
    build:
      context: .
      dockerfile: cmd/auth_service/Dockerfile
    ports:
      - "8082:8082"
    environment:
      GRPC_PORT: "8082"
      ENV: "dev"
      DATABASE_DSN: "host=postgres user=postgres password=postgres dbname=diplomaflow port=5432 sslmode=disable TimeZone=UTC"
      REDIS_ADDR: "redis:6379"
      JWT_SECRET: "dev_secret"
      ACCESS_TOKEN_TTL: "15m"
      REFRESH_TOKEN_TTL: "720h"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=localhost:8082", "-service=auth.AuthService"]
      interval: 10s
      timeout: 3s
      retries: 15
      start_period: 15s

  project_service:
    container_name: project_service
    build:
      context: .
      dockerfile: cmd/project_service/Dockerfile
    ports:
      - "8083:8083"
    environment:
      GRPC_PORT: "8083"
      ENV: "dev"
      DATABASE_DSN: "host=postgres user=postgres password=postgres dbname=diplomaflow port=5432 sslmode=disable TimeZone=UTC"
      KAFKA_BROKERS: "kafka:29092"
      WORKFLOW_SERVICE_ADDR: "workflow_service:8085"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=localhost:8083", "-service=project.ProjectService"]
      interval: 10s
      timeout: 3s
      retries: 15
      start_period: 15s

  team_service:
    container_name: team_service
    build:
      context: .
      dockerfile: cmd/team_service/Dockerfile
    ports:
      - "8084:8084"
    environment:
      GRPC_PORT: "8084"
      ENV: "dev"
      DATABASE_DSN: "host=postgres user=postgres password=postgres dbname=diplomaflow port=5432 sslmode=disable TimeZone=UTC"
      KAFKA_BROKERS: "kafka:29092"
      AUTH_SERVICE_ADDR: "auth_service:8082"
      NOTIFICATION_SERVICE_ADDR: "notification_service:8087"
      WORKFLOW_SERVICE_ADDR: "workflow_service:8085"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      auth_service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=localhost:8084", "-service=team.TeamService"]
      interval: 10s
      timeout: 3s
      retries: 15
      start_period: 15s

  workflow_service:
    container_name: workflow_service
    build:
      context: .
      dockerfile: cmd/workflow_service/Dockerfile
    ports:
      - "8085:8085"
    environment:
      GRPC_PORT: "8085"
      ENV: "dev"
      DATABASE_DSN: "host=postgres user=postgres password=postgres dbname=diplomaflow port=5432 sslmode=disable TimeZone=UTC"
      KAFKA_BROKERS: "kafka:29092"
      KAFKA_GROUP_ID: "workflow-service-group"
      SERVICES_NOTIFICATION_ADDR: "notification_service:8087"
      SERVICES_PROJECT_ADDR: "project_service:8083"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      project_service:
        condition: service_healthy
      notification_service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=localhost:8085", "-service=workflow.v1.WorkflowService"]
      interval: 10s
      timeout: 3s
      retries: 15
      start_period: 15s

  role_service:
    container_name: role_service
    build:
      context: .
      dockerfile: cmd/role_service/Dockerfile
    ports:
      - "8086:8086"
    environment:
      GRPC_PORT: "8086"
      ENV: "dev"
      DATABASE_DSN: "host=postgres user=postgres password=postgres dbname=diplomaflow port=5432 sslmode=disable TimeZone=UTC"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=localhost:8086", "-service=role.v1.RoleService"]
      interval: 10s
      timeout: 3s
      retries: 15
      start_period: 15s

  notification_service:
    container_name: notification_service
    build:
      context: .
      dockerfile: cmd/notification_service/Dockerfile
    ports:
      - "8087:8087"
    environment:
      GRPC_PORT: "8087"
      ENV: "dev"
      DATABASE_DSN: "host=postgres user=postgres password=postgres dbname=diplomaflow port=5432 sslmode=disable TimeZone=UTC"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=localhost:8087", "-service=notification.NotificationService"]
      interval: 10s
      timeout: 3s
      retries: 15
      start_period: 15s

  file_service:
    container_name: file_service
    build:
      context: .
      dockerfile: cmd/file_service/Dockerfile
    ports:
      - "8088:8088"
    environment:
      GRPC_PORT: "8088"
      ENV: "dev"
      DATABASE_DSN: "host=postgres user=postgres password=postgres dbname=diplomaflow port=5432 sslmode=disable TimeZone=UTC"
      STORAGE_PATH: "/uploads"
    volumes:
      - file_uploads:/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=localhost:8088", "-service=file.FileService"]
      interval: 10s
      timeout: 3s
      retries: 15
      start_period: 15s

  form_service:
    container_name: form_service
    build:
      context: .
      dockerfile: cmd/form_service/Dockerfile
    ports:
      - "8089:8089"
    environment:
      GRPC_PORT: "8089"
      ENV: "dev"
      DATABASE_DSN: "host=postgres user=postgres password=postgres dbname=diplomaflow port=5432 sslmode=disable TimeZone=UTC"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=localhost:8089", "-service=form.FormService"]
      interval: 10s
      timeout: 3s
      retries: 15
      start_period: 15s

  admin_service:
    container_name: admin_service
    build:
      context: .
      dockerfile: cmd/admin_service/Dockerfile
    ports:
      - "8090:8090"
    environment:
      GRPC_PORT: "8090"
      ENV: "dev"
      DATABASE_DSN: "host=postgres user=postgres password=postgres dbname=diplomaflow port=5432 sslmode=disable TimeZone=UTC"
      AUTH_SERVICE_ADDR: "auth_service:8082"
      PROJECT_SERVICE_ADDR: "project_service:8083"
      TEAM_SERVICE_ADDR: "team_service:8084"
      WORKFLOW_SERVICE_ADDR: "workflow_service:8085"
    depends_on:
      postgres:
        condition: service_healthy
      auth_service:
        condition: service_healthy
      project_service:
        condition: service_healthy
      team_service:
        condition: service_healthy
      workflow_service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=localhost:8090", "-service=admin.v1.AdminService"]
      interval: 10s
      timeout: 3s
      retries: 15
      start_period: 15s

volumes:
  file_uploads:
