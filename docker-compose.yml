services:
  main_postgres:
    image: postgres:16-alpine
    container_name: main_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - diplomaflow_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U diplomaflow -d diplomaflow" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - app_network

  migrations:
    build:
      context: .
      dockerfile: cmd/migrate/Dockerfile
    container_name: migrations
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@main_postgres:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      main_postgres:
        condition: service_healthy
    volumes:
      - ./db/migrations:/app/migrations:ro
    command: [ "-cmd", "up", "-path", "file:///app/migrations" ]
    networks:
      - app_network

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: localhost
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      KAFKA_LOG4J_LOGGERS: "kafka.controller=WARN,kafka.log.LogCleaner=WARN,state.change.logger=WARN,kafka.coordinator.group=WARN"
      KAFKA_CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_HEAP_OPTS: "-Xmx256M -Xms256M"

    healthcheck:
        test: ["CMD-SHELL", "cub kafka-ready -b kafka:29092 1 60"]
        interval: 10s
        timeout: 10s
        retries: 30
        start_period: 60s
    networks:
      - app_network



  university_service:
    build:
      context: .
      dockerfile: cmd/university_service/Dockerfile
    container_name: university_service
    env_file:
      - .env
    environment:
      - GRPC_PORT=${PORT_UNIVERSITY}
      - GOMEMLIMIT=64MiB
    deploy:
      resources:
        limits:
          memory: 128M
    ports:
      - "${PORT_UNIVERSITY}:${PORT_UNIVERSITY}"
    depends_on:
      main_postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully

    networks:
      - app_network

#Admin service(ADDED BY SULA)
  admin_service:
    build:
      context: .
      dockerfile: cmd/admin_service/Dockerfile
    container_name: admin_service
    env_file:
      - .env
    environment:
      - GRPC_PORT=${PORT_ADMIN}
      - GOMEMLIMIT=64MiB
    deploy:
      resources:
        limits:
          memory: 128M
    ports:
      - "${PORT_ADMIN}:${PORT_ADMIN}"
    depends_on:
      main_postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      auth_service:
        condition: service_healthy
      project_service:
        condition: service_healthy
      team_service:
        condition: service_healthy
      workflow_service:
        condition: service_healthy
    networks:
      - app_network

  role_service:
    build:
      context: .
      dockerfile: cmd/role_service/Dockerfile
    container_name: role_service
    env_file:
      - .env
    environment:
      - GRPC_PORT=${PORT_ROLE}
      - GOMEMLIMIT=64MiB
    deploy:
      resources:
        limits:
          memory: 128M
    ports:
      - "${PORT_ROLE}:${PORT_ROLE}"
    depends_on:
      main_postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    networks:
      - app_network
  redis:
    image: redis:7.2-alpine
    container_name: redis
    ports:
      - "6379:6379"
    command: redis-server --save 20 1 --loglevel warning
    volumes:
      - diplomaflow_redis:/data
    networks:
      - app_network
    deploy:
      resources:
        limits:
          memory: 128M
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
  auth_service:
    build:
      context: .
      dockerfile: cmd/auth_service/Dockerfile
    container_name: auth_service
    env_file:
      - .env
    environment:
      - GRPC_PORT=${PORT_AUTH}
      - JWT_SECRET=${JWT_SECRET}
      - DATABASE_DSN=${DATABASE_DSN}
      - JWT_ACCESS_TOKEN_TTL=15m
      - JWT_REFRESH_TOKEN_TTL=720h
      - GOMEMLIMIT=64MiB
      - REDIS_ADDR=redis:6379
    deploy:
      resources:
        limits:
          memory: 128M
    ports:
      - "${PORT_AUTH}:${PORT_AUTH}"
    healthcheck:
      test: [ "CMD", "nc", "-z", "localhost", "8082" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      main_postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      university_service:
        condition: service_started
      role_service:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - app_network

  workflow_service:
    build:
      context: .
      dockerfile: cmd/workflow_service/Dockerfile
    container_name: workflow_service
    env_file:
      - .env
    environment:
      - GRPC_PORT=${PORT_WORKFLOW}
      - GOMEMLIMIT=64MiB
    deploy:
      resources:
        limits:
          memory: 128M
    ports:
      - "${PORT_WORKFLOW}:${PORT_WORKFLOW}"
    healthcheck:
      test: [ "CMD", "nc", "-z", "localhost", "8085" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      main_postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    networks:
      - app_network

  team_service:
    build:
      context: .
      dockerfile: cmd/team_service/Dockerfile
    container_name: team_service
    env_file:
      - .env
    environment:
      - GRPC_PORT=${PORT_TEAM}
      - KAFKA_BROKERS=kafka:29092
      - SERVICES_WORKFLOW_ADDR=workflow_service:${PORT_WORKFLOW}
      - GOMEMLIMIT=64MiB
    deploy:
      resources:
        limits:
          memory: 128M
    ports:
      - "${PORT_TEAM}:${PORT_TEAM}"
    healthcheck:
      test: [ "CMD", "nc", "-z", "localhost", "8084" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    depends_on:
      main_postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      auth_service:
        condition: service_started
      kafka:
        condition: service_started
    networks:
      - app_network

  project_service:
    build:
      context: .
      dockerfile: cmd/project_service/Dockerfile
    container_name: project_service
    env_file:
      - .env
    environment:
      - GRPC_PORT=${PORT_PROJECT}
      - KAFKA_BROKERS=kafka:29092
      - SERVICES_WORKFLOW_ADDR=workflow_service:${PORT_WORKFLOW}
      - SERVICES_NOTIFICATION_ADDR=notification_service:${PORT_NOTIFICATION}
      - GOMEMLIMIT=64MiB
    deploy:
      resources:
        limits:
          memory: 128M
    ports:
      - "${PORT_PROJECT}:${PORT_PROJECT}"
    healthcheck:
      test: [ "CMD", "nc", "-z", "localhost", "8083" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    depends_on:
      main_postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      workflow_service:
        condition: service_started
      team_service:
        condition: service_started
      kafka:
        condition: service_started
    networks:
      - app_network

  notification_service:
    build:
      context: .
      dockerfile: cmd/notification_service/Dockerfile
    container_name: notification_service
    env_file:
      - .env
    environment:
      - GRPC_PORT=${PORT_NOTIFICATION}
      - GOMEMLIMIT=64MiB
    deploy:
      resources:
        limits:
          memory: 128M
    ports:
      - "${PORT_NOTIFICATION}:${PORT_NOTIFICATION}"
    depends_on:
      main_postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    networks:
      - app_network

  file_service:
    build:
      context: .
      dockerfile: cmd/file_service/Dockerfile
    container_name: file_service
    env_file:
      - .env
    environment:
      - GRPC_PORT=${PORT_FILE}
      - GOMEMLIMIT=64MiB
      - DATABASE_DSN=${DATABASE_DSN}
    depends_on:
      main_postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 128M
    ports:
      - "${PORT_FILE}:${PORT_FILE}"
    volumes:
      - diplomaflow_uploads:/app/uploads
    networks:
      - app_network

  form_service:
    build:
      context: .
      dockerfile: cmd/form_service/Dockerfile
    container_name: form_service
    env_file:
      - .env
    environment:
      - GRPC_PORT=${PORT_FORM}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - DATABASE_DSN=host=main_postgres user=${POSTGRES_USER} password=${POSTGRES_PASSWORD} dbname=${POSTGRES_DB} port=5432 sslmode=disable
      - GOMEMLIMIT=64MiB
    deploy:
      resources:
        limits:
          memory: 128M
    ports:
      - "${PORT_FORM}:${PORT_FORM}"
    depends_on:
      main_postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    networks:
      - app_network

  api_gateway:
    build:
      context: .
      dockerfile: cmd/api_gateway/Dockerfile
    container_name: api_gateway
    env_file:
      - .env
    environment:
      - PORT=${PORT_GATEWAY}
      - SERVICES_FILE_ADDR=file_service:${PORT_FILE}
      - SERVICES_FORM_ADDR=form_service:${PORT_FORM}
      - REDIS_ADDR=redis:6379
      - GOMEMLIMIT=64MiB
    deploy:
      resources:
        limits:
          memory: 128M
    ports:
      - "${PORT_GATEWAY}:${PORT_GATEWAY}"
    depends_on:
      auth_service:
        condition: service_started
      project_service:
        condition: service_started
      team_service:
        condition: service_started
      workflow_service:
        condition: service_started
      university_service:
        condition: service_started
      role_service:
        condition: service_started
      file_service:
        condition: service_started
      form_service:
        condition: service_started
      redis:
        condition: service_healthy
    volumes:
      - diplomaflow_uploads:/app/uploads
    networks:
      - app_network

volumes:
  diplomaflow_data:
  diplomaflow_uploads:
  diplomaflow_redis:

networks:
  app_network:
    driver: bridge


