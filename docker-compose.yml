name: diplomaflow

# ============================================================
# Общие env для сервисов (берём из .env через --env-file)
# ============================================================
x-common-env: &common_env
  ENV: ${ENV:-production}
  DATABASE_DSN: ${DATABASE_DSN:?DATABASE_DSN is required}

# ============================================================
# gRPC адреса сервисов ВНУТРИ docker-сети (НЕ localhost)
# ============================================================
x-service-addrs-docker: &svc_addrs_docker
  SERVICES_AUTH_ADDR: auth_service:8082
  SERVICES_UNIVERSITY_ADDR: university_service:8081
  SERVICES_PROJECT_ADDR: project_service:8083
  SERVICES_TEAM_ADDR: team_service:8084
  SERVICES_WORKFLOW_ADDR: workflow_service:8085
  SERVICES_NOTIFICATION_ADDR: notification_service:8087
  SERVICES_FILE_ADDR: file_service:8088
  SERVICES_FORM_ADDR: form_service:8089
  SERVICES_ADMIN_ADDR: admin_service:8090
  SERVICES_TASK_ADDR: task_service:8091

# ============================================================
# Лимит логов контейнеров
# ============================================================
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

networks:
  diplomaflow:
    driver: bridge

volumes:
  pg_data:
  file_uploads:
  prom_data:
  grafana_data:

services:
  main_postgres:
    image: postgres:16-alpine
    logging: *default-logging
    networks: [diplomaflow]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-diplomaflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-diplomaflow}
    volumes:
      - pg_data:/var/lib/postgresql/data
    # (опционально) если хочешь доступ к БД с хоста — оставь только localhost
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -h 127.0.0.1 -p 5432"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    logging: *default-logging
    networks: [diplomaflow]
    # стандартный порт внутри контейнера
    command: redis-server --port 6379
    # (опционально) доступ с хоста — только localhost
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-h", "127.0.0.1", "-p", "6379", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: cmd/migrate/Dockerfile
    logging: *default-logging
    networks: [diplomaflow]
    depends_on:
      main_postgres:
        condition: service_healthy
    environment:
      # Миграции должны ходить в БД через docker DNS, не localhost [[2]]
      DATABASE_URL: postgres://${POSTGRES_USER:-diplomaflow}:${POSTGRES_PASSWORD}@main_postgres:5432/${POSTGRES_DB:-diplomaflow}?sslmode=disable
    command: ["-cmd=up", "-path=file:///app/db/migrations"]
    restart: "no"

  api_gateway:
    build:
      context: .
      dockerfile: cmd/api_gateway/Dockerfile
    logging: *default-logging
    networks: [diplomaflow]
    environment:
      ENV: ${ENV:-production}
      PORT: "8080"
      # Внутри сети redis по имени сервиса
      REDIS_ADDR: redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      METRICS_PORT: ${METRICS_PORT:-9091}
      <<: *svc_addrs_docker
    depends_on:
      redis:
        condition: service_healthy
      auth_service:
        condition: service_started
    # Публикуем gateway только на localhost (под nginx), наружу не торчит
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null 2>&1"]
      interval: 10s
      timeout: 3s
      retries: 15
      start_period: 10s
    restart: unless-stopped

  university_service:
    build:
      context: .
      dockerfile: cmd/university_service/Dockerfile
    logging: *default-logging
    networks: [diplomaflow]
    environment:
      <<: *common_env
      GRPC_PORT: "8081"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=127.0.0.1:8081", "-service=university.v1.UniversityService"]
      interval: 10s
      timeout: 3s
      retries: 15
      start_period: 20s
    restart: unless-stopped

  auth_service:
    build:
      context: .
      dockerfile: cmd/auth_service/Dockerfile
    logging: *default-logging
    networks: [diplomaflow]
    environment:
      <<: *common_env
      GRPC_PORT: "8082"
      REDIS_ADDR: redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-24h}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-720h}
      SERVICES_UNIVERSITY_ADDR: university_service:8081
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      university_service:
        condition: service_started
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=127.0.0.1:8082", "-service=auth.v1.AuthService"]
      interval: 10s
      timeout: 3s
      retries: 15
      start_period: 20s
    restart: unless-stopped

  notification_service:
    build:
      context: .
      dockerfile: cmd/notification_service/Dockerfile
    logging: *default-logging
    networks: [diplomaflow]
    environment:
      <<: *common_env
      GRPC_PORT: "8087"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=127.0.0.1:8087", "-service=notification.v1.NotificationService"]
      interval: 10s
      timeout: 3s
      retries: 15
      start_period: 20s
    restart: unless-stopped

  workflow_service:
    build:
      context: .
      dockerfile: cmd/workflow_service/Dockerfile
    logging: *default-logging
    networks: [diplomaflow]
    environment:
      <<: *common_env
      GRPC_PORT: "8085"
      SERVICES_NOTIFICATION_ADDR: notification_service:8087
      SERVICES_PROJECT_ADDR: project_service:8083
      SERVICES_TEAM_ADDR: team_service:8084
    depends_on:
      migrate:
        condition: service_completed_successfully
      notification_service:
        condition: service_started
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=127.0.0.1:8085", "-service=workflow.v1.WorkflowService"]
      interval: 10s
      timeout: 3s
      retries: 15
      start_period: 20s
    restart: unless-stopped

  project_service:
    build:
      context: .
      dockerfile: cmd/project_service/Dockerfile
    logging: *default-logging
    networks: [diplomaflow]
    environment:
      <<: *common_env
      GRPC_PORT: "8083"
      SERVICES_WORKFLOW_ADDR: workflow_service:8085
      SERVICES_NOTIFICATION_ADDR: notification_service:8087
    depends_on:
      migrate:
        condition: service_completed_successfully
      workflow_service:
        condition: service_started
      notification_service:
        condition: service_started
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=127.0.0.1:8083", "-service=project.v1.ProjectService"]
      interval: 10s
      timeout: 3s
      retries: 15
      start_period: 20s
    restart: unless-stopped

  team_service:
    build:
      context: .
      dockerfile: cmd/team_service/Dockerfile
    logging: *default-logging
    networks: [diplomaflow]
    environment:
      <<: *common_env
      GRPC_PORT: "8084"
      SERVICES_AUTH_ADDR: auth_service:8082
      SERVICES_WORKFLOW_ADDR: workflow_service:8085
      SERVICES_NOTIFICATION_ADDR: notification_service:8087
    depends_on:
      migrate:
        condition: service_completed_successfully
      auth_service:
        condition: service_started
      workflow_service:
        condition: service_started
      notification_service:
        condition: service_started
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=127.0.0.1:8084", "-service=team.v1.TeamService"]
      interval: 10s
      timeout: 3s
      retries: 15
      start_period: 20s
    restart: unless-stopped

  file_service:
    build:
      context: .
      dockerfile: cmd/file_service/Dockerfile
    logging: *default-logging
    networks: [diplomaflow]
    environment:
      <<: *common_env
      GRPC_PORT: "8088"
      STORAGE_PATH: "/uploads"
    volumes:
      - file_uploads:/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=127.0.0.1:8088", "-service=file.v1.FileService"]
      interval: 10s
      timeout: 3s
      retries: 15
      start_period: 20s
    restart: unless-stopped

  form_service:
    build:
      context: .
      dockerfile: cmd/form_service/Dockerfile
    logging: *default-logging
    networks: [diplomaflow]
    environment:
      <<: *common_env
      GRPC_PORT: "8089"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=127.0.0.1:8089", "-service=form.v1.FormService"]
      interval: 10s
      timeout: 3s
      retries: 15
      start_period: 20s
    restart: unless-stopped

  admin_service:
    build:
      context: .
      dockerfile: cmd/admin_service/Dockerfile
    logging: *default-logging
    networks: [diplomaflow]
    environment:
      <<: *common_env
      GRPC_PORT: "8090"
      SERVICES_AUTH_ADDR: auth_service:8082
      SERVICES_PROJECT_ADDR: project_service:8083
      SERVICES_TEAM_ADDR: team_service:8084
      SERVICES_WORKFLOW_ADDR: workflow_service:8085
    depends_on:
      migrate:
        condition: service_completed_successfully
      auth_service:
        condition: service_started
      project_service:
        condition: service_started
      team_service:
        condition: service_started
      workflow_service:
        condition: service_started
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=127.0.0.1:8090", "-service=admin.v1.AdminService"]
      interval: 10s
      timeout: 3s
      retries: 15
      start_period: 20s
    restart: unless-stopped

  task_service:
    build:
      context: .
      dockerfile: cmd/task_service/Dockerfile
    logging: *default-logging
    networks: [diplomaflow]
    environment:
      <<: *common_env
      GRPC_PORT: "8091"
      SERVICES_AUTH_ADDR: auth_service:8082
      SERVICES_TEAM_ADDR: team_service:8084
      SERVICES_NOTIFICATION_ADDR: notification_service:8087
      SERVICES_FILE_ADDR: file_service:8088
    depends_on:
      migrate:
        condition: service_completed_successfully
      auth_service:
        condition: service_started
      team_service:
        condition: service_started
      notification_service:
        condition: service_started
      file_service:
        condition: service_started
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=127.0.0.1:8091", "-service=task.v1.TaskService"]
      interval: 10s
      timeout: 3s
      retries: 15
      start_period: 20s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    logging: *default-logging
    networks: [diplomaflow]
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    # (опционально) наружу не надо — только локально
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    logging: *default-logging
    networks: [diplomaflow]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_SERVER_HTTP_ADDR: 127.0.0.1   # только локально (доступ через nginx/VPN)
      GF_SERVER_HTTP_PORT: 3001        # новый порт grafana
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    restart: unless-stopped
