version: '3.8'

services:
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: localhost
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      KAFKA_CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    healthcheck:
      test: nc -z localhost 9092 || exit 1
      interval: 10s
      retries: 5
      start_period: 10s
    networks:
      - app_network

  main_postgres:
    image: postgres:16-alpine
    container_name: main_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - diplomaflow_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_network


  university_service:
    build:
      context: .
      dockerfile: cmd/university_service/Dockerfile
    container_name: university_service
    env_file:
      - .env
    environment:
      - APP_GRPC_PORT=${PORT_UNIVERSITY}
    ports:
      - "${PORT_UNIVERSITY}:${PORT_UNIVERSITY}"
    depends_on:
      main_postgres:
        condition: service_healthy
    networks:
      - app_network

  role_service:
    build:
      context: .
      dockerfile: cmd/role_service/Dockerfile
    container_name: role_service
    env_file:
      - .env
    environment:
      - APP_GRPC_PORT=${PORT_ROLE}
    ports:
      - "${PORT_ROLE}:${PORT_ROLE}"
    depends_on:
      main_postgres:
        condition: service_healthy
    networks:
      - app_network

  auth_service:
    build:
      context: .
      dockerfile: cmd/auth_service/Dockerfile
    container_name: auth_service
    env_file:
      - .env
    environment:
      - APP_GRPC_PORT=${PORT_AUTH}
    ports:
      - "${PORT_AUTH}:${PORT_AUTH}"
    depends_on:
      main_postgres:
        condition: service_healthy
      university_service:
        condition: service_started
      role_service:
        condition: service_started
    networks:
      - app_network

  workflow_service:
    build:
      context: .
      dockerfile: cmd/workflow_service/Dockerfile
    container_name: workflow_service
    env_file:
      - .env
    environment:
      - APP_GRPC_PORT=${PORT_WORKFLOW}
    ports:
      - "${PORT_WORKFLOW}:${PORT_WORKFLOW}"
    depends_on:
      main_postgres:
        condition: service_healthy
    networks:
      - app_network

  team_service:
    build:
      context: .
      dockerfile: cmd/team_service/Dockerfile
    container_name: team_service
    env_file:
      - .env
    environment:
      - APP_GRPC_PORT=${PORT_TEAM}
    ports:
      - "${PORT_TEAM}:${PORT_TEAM}"
    depends_on:
      main_postgres:
        condition: service_healthy
      auth_service:
        condition: service_started
      kafka:
        condition: service_healthy
    networks:
      - app_network

  project_service:
    build:
      context: .
      dockerfile: cmd/project_service/Dockerfile
    container_name: project_service
    env_file:
      - .env
    environment:
      - APP_GRPC_PORT=${PORT_PROJECT}
    ports:
      - "${PORT_PROJECT}:${PORT_PROJECT}"
    depends_on:
      main_postgres:
        condition: service_healthy
      workflow_service:
        condition: service_started
      team_service:
        condition: service_started
      kafka:
        condition: service_healthy
    networks:
      - app_network

  api_gateway:
    build:
      context: .
      dockerfile: cmd/api_gateway/Dockerfile
    container_name: api_gateway
    env_file:
      - .env
    environment:
      - APP_PORT=${PORT_GATEWAY}
    ports:
      - "${PORT_GATEWAY}:${PORT_GATEWAY}"
    depends_on:
      - auth_service
      - project_service
      - team_service
      - workflow_service
      - university_service
      - role_service
    networks:
      - app_network

volumes:
  diplomaflow_data:

networks:
  app_network:
    driver: bridge
