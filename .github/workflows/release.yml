name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build all services
        run: |
          mkdir -p dist
          for svc in api_gateway auth_service file_service form_service notification_service project_service role_service team_service university_service workflow_service; do
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags "-s -w" -o dist/${svc}_linux_amd64 ./cmd/${svc}
            CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags "-s -w" -o dist/${svc}_darwin_amd64 ./cmd/${svc}
            CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags "-s -w" -o dist/${svc}_windows_amd64.exe ./cmd/${svc}
          done

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*
          generate_release_notes: true
