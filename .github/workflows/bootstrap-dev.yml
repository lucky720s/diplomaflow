name: Bootstrap Dev Server (one-time)

on:
  workflow_dispatch:

concurrency:
  group: bootstrap-dev
  cancel-in-progress: false

permissions:
  contents: read

env:
  ENV_NAME: dev
  IMAGE_TAG: ${{ github.sha }}
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug list expected files
        run: |
          echo "ref=${GITHUB_REF} sha=${GITHUB_SHA}"
          ls -la
          ls -la deploy || true
          find . -maxdepth 3 -type f \( -name "compose.infra.yml" -o -name "compose.app.deploy.yml" -o -name "bootstrap.sh" \) -print

      - name: Copy deploy files to server (to /opt)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          overwrite: true
          debug: true
          source: "compose.infra.yml,compose.app.deploy.yml,deploy/bootstrap.sh"
          target: "/opt/diplomaflow_deploy_bundle"

      - name: Bootstrap via SSH (no sudo)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script: |
            set -euo pipefail

            mkdir -p /opt/diplomaflow_deploy /opt/diplomaflow_scripts/deploy

            cp -f /opt/diplomaflow_deploy_bundle/compose.infra.yml /opt/diplomaflow_deploy/compose.infra.yml
            cp -f /opt/diplomaflow_deploy_bundle/compose.app.deploy.yml /opt/diplomaflow_deploy/compose.app.deploy.yml
            cp -f /opt/diplomaflow_deploy_bundle/deploy/bootstrap.sh /opt/diplomaflow_scripts/deploy/bootstrap.sh
            chmod +x /opt/diplomaflow_scripts/deploy/bootstrap.sh

            GHCR_USERNAME="${{ secrets.GHCR_USERNAME }}" \
            GHCR_TOKEN="${{ secrets.GHCR_TOKEN }}" \
            JWT_SECRET="${{ secrets.JWT_SECRET_DEV }}" \
            POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD_DEV }}" \
            /opt/diplomaflow_scripts/deploy/bootstrap.sh \
              "${{ env.ENV_NAME }}" \
              "${{ env.IMAGE_PREFIX }}" \
              "${{ env.IMAGE_TAG }}"
