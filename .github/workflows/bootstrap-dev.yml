name: Bootstrap Dev Server (one-time)

on:
  workflow_dispatch:

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug: list expected files
        run: |
          echo "ref=${GITHUB_REF} sha=${GITHUB_SHA}"
          ls -la
          ls -la deploy || true
          echo "---- find ----"
          find . -maxdepth 3 -type f -name "compose.infra.yml" -print
          find . -maxdepth 3 -type f -name "compose.app.deploy.yml" -print
          find . -maxdepth 3 -type f -name "bootstrap.sh" -print

      - name: Copy deploy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          overwrite: true
          debug: true
          source: "compose.infra.yml,compose.app.deploy.yml,deploy/bootstrap.sh"
          target: "/opt/diplomaflow_deploy_bundle"
