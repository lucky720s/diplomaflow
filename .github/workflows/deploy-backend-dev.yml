name: Deploy Backend (dev)

on:
  push:
    branches: ["dev"]
  workflow_dispatch: {}

concurrency:
  group: diplomaflow-backend-dev
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assert tools exist
        shell: bash
        run: |
          set -euo pipefail
          command -v rsync
          docker compose version

      - name: Write /opt/diplomaflow_state/.env from GitHub Secrets (atomic)
        shell: bash
        env:
          BACKEND_ENV_B64: ${{ secrets.BACKEND_ENV_B64 }}
        run: |
          set -euo pipefail
          umask 077

          test -n "$BACKEND_ENV_B64"
          test -d /opt/diplomaflow_state

          tmp="$(mktemp)"
          echo "$BACKEND_ENV_B64" | base64 -d > "$tmp"
          chmod 600 "$tmp"
          mv -f "$tmp" /opt/diplomaflow_state/.env

      - name: Sync code to /opt/diplomaflow
        shell: bash
        run: |
          set -euo pipefail
          test -d /opt/diplomaflow

          rsync -a --delete \
            --exclude ".git" \
            --exclude ".github" \
            ./ /opt/diplomaflow/

      - name: Deploy (docker compose + migrate)
        shell: bash
        run: |
          set -euo pipefail
          bash /opt/diplomaflow_scripts/deploy_backend.sh

      # (опционально) если хочешь именно через systemd дергать:
      # у тебя systemctl в sudo NOPASSWD разрешён
      # - name: Restart systemd unit
      #   run: sudo systemctl restart diplomaflow-backend.service
