name: Deploy Backend (dev)

on:
  push:
    branches: ["dev"]
  workflow_dispatch: {}

concurrency:
  group: diplomaflow-backend-dev
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync repo to /opt/diplomaflow
        shell: bash
        run: |
          set -euo pipefail

          # гарантируем, что каталог существует и принадлежит user
          sudo mkdir -p /opt/diplomaflow
          sudo chown -R user:user /opt/diplomaflow

          # rsync должен быть установлен один раз на сервере
          command -v rsync >/dev/null 2>&1 || { echo "rsync not installed"; exit 1; }

          rsync -a --delete \
            --exclude ".git" \
            --exclude ".github" \
            ./ /opt/diplomaflow/

      - name: Write /opt/diplomaflow_state/.env from GitHub Secrets
        shell: bash
        env:
          BACKEND_ENV_B64: ${{ secrets.BACKEND_ENV_B64 }}
        run: |
          set -euo pipefail
          umask 077

          sudo mkdir -p /opt/diplomaflow_state
          sudo chown -R user:user /opt/diplomaflow_state
          sudo chmod 700 /opt/diplomaflow_state

          test -n "$BACKEND_ENV_B64"

          tmp="$(mktemp)"
          echo "$BACKEND_ENV_B64" | base64 -d > "$tmp"
          chmod 600 "$tmp"
          mv -f "$tmp" /opt/diplomaflow_state/.env

      - name: Deploy (docker compose + migrate)
        shell: bash
        run: |
          set -euo pipefail
          bash /opt/diplomaflow_scripts/deploy_backend.sh
