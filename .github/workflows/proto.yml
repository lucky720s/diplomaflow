name: Protobuf Check

on:
  pull_request:
    paths:
      - 'api/proto/**'
      - 'third_party/**'

jobs:
  proto-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
          go install github.com/envoyproxy/protoc-gen-validate@latest

      - name: Generate protobuf
        run: |
          mkdir -p pkg/protobuf
          protoc \
            --plugin=protoc-gen-validate=$(go env GOPATH)/bin/protoc-gen-validate \
            --proto_path=api/proto \
            --proto_path=third_party \
            --go_out=pkg/protobuf --go_opt=paths=source_relative \
            --go-grpc_out=pkg/protobuf --go-grpc_opt=paths=source_relative \
            --validate_out="lang=go:pkg/protobuf" --validate_opt=paths=source_relative \
            $(find api/proto -name "*.proto")

      - name: Check for uncommitted changes
        run: |
          if [[ -n $(git status --porcelain pkg/protobuf) ]]; then
            echo "::error::Generated protobuf files are out of date!"
            echo "Run 'make proto' locally and commit the changes."
            git diff pkg/protobuf
            exit 1
          fi
