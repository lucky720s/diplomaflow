name: CD - Deploy to Dev Server

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server (ssh)
        uses: appleboy/ssh-action@v1.0.3
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          JWT_SECRET: ${{ secrets.JWT_SECRET_DEV }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD_DEV }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 60m
          envs: PAT_TOKEN,JWT_SECRET,POSTGRES_PASSWORD
          script: |
            set -euo pipefail
            umask 077

            APP_DIR="/opt/diplomaflow"
            REPO="${{ github.repository }}"
            BRANCH="dev"
            PROJECT_NAME="diplomaflow"
            PG_VOLUME="${PROJECT_NAME}_pg_data"

            export DOCKER_BUILDKIT=1
            export COMPOSE_DOCKER_CLI_BUILD=1

            echo "==> Ensure app dir"
            sudo mkdir -p "$APP_DIR"
            sudo chown "$USER":"$USER" "$APP_DIR"
            cd "$APP_DIR"

            echo "==> Sync repository"
            if [ -d ".git" ]; then
              git remote set-url origin "https://${PAT_TOKEN}@github.com/${REPO}.git"
              git fetch origin "$BRANCH"
              git reset --hard "origin/${BRANCH}"
              git clean -fd
            else
              rm -rf "$APP_DIR"/*
              git clone -b "$BRANCH" "https://${PAT_TOKEN}@github.com/${REPO}.git" .
            fi

            echo "==> Validate required secrets"
            : "${JWT_SECRET:?Missing JWT_SECRET_DEV}"
            : "${POSTGRES_PASSWORD:?Missing POSTGRES_PASSWORD_DEV}"

            echo "==> Ensure POSTGRES_PASSWORD is URL-safe (no python3 on server)"
            if echo "$POSTGRES_PASSWORD" | grep -Eq '^[A-Za-z0-9_.~-]+$'; then
              PG_PASS_URLENC="$POSTGRES_PASSWORD"
            else
              echo "ERROR: POSTGRES_PASSWORD_DEV has special chars. Use only A-Za-z0-9_.~- for dev."
              exit 1
            fi

            # capture old password from existing .env (if any) BEFORE rewriting it
            OLD_PASS=""
            if [ -f ".env" ]; then
              OLD_PASS="$(grep '^POSTGRES_PASSWORD=' .env | cut -d= -f2- || true)"
            fi

            echo "==> Render desired .env"
            cat > .env.desired <<EOF
            # managed-by-cd: true
            ENV_FILE_VERSION=2

            ENV=dev
            GIN_MODE=release

            JWT_SECRET=${JWT_SECRET}

            POSTGRES_USER=diplomaflow
            POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            POSTGRES_DB=diplomaflow
            POSTGRES_PORT=5432
            POSTGRES_HOST_PORT=5433

            DATABASE_DSN=host=main_postgres user=diplomaflow password=${POSTGRES_PASSWORD} dbname=diplomaflow port=5432 sslmode=disable TimeZone=UTC
            DATABASE_URL=postgres://diplomaflow:${PG_PASS_URLENC}@main_postgres:5432/diplomaflow?sslmode=disable

            REDIS_ADDR=redis:6379
            KAFKA_BROKERS=kafka:29092
            KAFKA_GROUP_ID=diplomaflow-group
            KAFKA_KRAFT_CLUSTER_ID=MkU3OEVBNTcwNTJENDM2Qk

            PORT_GATEWAY=8080
            GATEWAY_BIND_ADDR=0.0.0.0
            EOF
            chmod 600 .env.desired

            echo "==> Sync .env if changed"
            if [ ! -f .env ] || ! cmp -s .env .env.desired; then
              echo "==> Updating .env (backup old)"
              [ -f .env ] && cp .env ".env.bak.$(date +%Y%m%d_%H%M%S)"
              mv .env.desired .env
            else
              rm -f .env.desired
              echo "==> .env unchanged"
            fi

            echo "==> Validate compose config"
            docker compose --env-file .env config >/dev/null

            reset_postgres() {
              echo "==> Reset Postgres volume (dev): ${PG_VOLUME}"
              docker compose --env-file .env down --remove-orphans || true
              docker volume rm -f "${PG_VOLUME}" || true
            }

            wait_postgres_healthy() {
              echo "==> Wait for Postgres healthy"
              for i in $(seq 1 90); do
                cid="$(docker compose --env-file .env ps -q main_postgres || true)"
                [ -n "$cid" ] || { sleep 1; continue; }
                st="$(docker inspect -f '{{.State.Health.Status}}' "$cid" 2>/dev/null || true)"
                [ "$st" = "healthy" ] && return 0
                sleep 1
              done
              cid="$(docker compose --env-file .env ps -q main_postgres || true)"
              echo "Postgres not healthy"
              [ -n "$cid" ] && docker logs --tail=200 "$cid" || true
              return 1
            }

            # Auto-fix #1: if password rotated -> reset pg volume to avoid auth-failed
            if [ -n "$OLD_PASS" ] && [ "$OLD_PASS" != "$POSTGRES_PASSWORD" ]; then
              echo "==> Detected POSTGRES_PASSWORD change. Will reset Postgres volume (dev)."
              reset_postgres
            fi

            echo "==> Start infra"
            docker compose --env-file .env up -d main_postgres redis kafka
            wait_postgres_healthy

            echo "==> Build services (parallel)"
            docker compose --env-file .env build --parallel

            echo "==> Run migrations (with one auto-retry after reset on failure)"
            set +e
            mig_out="$(docker compose --env-file .env run --rm migrate 2>&1)"
            mig_rc=$?
            set -e

            if [ "$mig_rc" -ne 0 ]; then
              echo "$mig_out"
              echo "==> Migrations failed. Last logs:"
              docker compose --env-file .env logs --tail=200 main_postgres || true

              echo "==> Auto-fix (dev): reset Postgres volume and retry migrations once"
              reset_postgres
              docker compose --env-file .env up -d main_postgres redis kafka
              wait_postgres_healthy
              docker compose --env-file .env run --rm migrate
            fi

            echo "==> Start app services"
            docker compose --env-file .env up -d --remove-orphans --no-build || {
              docker compose --env-file .env ps || true
              docker compose --env-file .env logs --tail=200 || true
              exit 1
            }

            echo "==> Healthcheck gateway"
            sleep 15
            curl -fsS "http://localhost:8080/healthz" >/dev/null

            docker compose --env-file .env ps
