name: CD - Deploy to Dev Server

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy deploy script to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "deploy/deploy.sh"
          target: "/opt/diplomaflow_scripts"
          overwrite: true

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 60m
          script: |
            chmod +x /opt/diplomaflow_scripts/deploy/deploy.sh
            /opt/diplomaflow_scripts/deploy/deploy.sh "/opt/diplomaflow" "/opt/diplomaflow_state" "${{ secrets.PAT_TOKEN }}" "${{ secrets.JWT_SECRET_DEV }}" "${{ secrets.POSTGRES_PASSWORD_DEV }}" "${{ github.repository }}" "dev"
