name: CD - Deploy to Dev Server

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server (ssh)
        uses: appleboy/ssh-action@v1.0.3
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          JWT_SECRET: ${{ secrets.JWT_SECRET_DEV }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD_DEV }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 60m
          envs: PAT_TOKEN,JWT_SECRET,POSTGRES_PASSWORD
          script: |
            set -euo pipefail
            umask 077

            APP_DIR="/opt/diplomaflow"
            REPO="${{ github.repository }}"
            BRANCH="dev"

            # фиксируем project name, чтобы volume назывался стабильно
            PROJECT_NAME="diplomaflow"
            LAST_SHA_FILE=".last_deploy_sha"
            PG_VOLUME="${PROJECT_NAME}_pg_data"

            export DOCKER_BUILDKIT=1
            export COMPOSE_DOCKER_CLI_BUILD=1

            dc() {
              docker compose -p "$PROJECT_NAME" --env-file .env "$@"
            }

            echo "==> Ensure app dir"
            sudo mkdir -p "$APP_DIR"
            sudo chown "$USER":"$USER" "$APP_DIR"
            cd "$APP_DIR"

            echo "==> Sync repository"
            if [ -d ".git" ]; then
              git remote set-url origin "https://${PAT_TOKEN}@github.com/${REPO}.git"
              git fetch origin "$BRANCH"
              git reset --hard "origin/${BRANCH}"
              git clean -fd
            else
              rm -rf "$APP_DIR"/*
              git clone -b "$BRANCH" "https://${PAT_TOKEN}@github.com/${REPO}.git" .
            fi

            echo "==> Validate required secrets"
            : "${JWT_SECRET:?Missing JWT_SECRET_DEV}"
            : "${POSTGRES_PASSWORD:?Missing POSTGRES_PASSWORD_DEV}"

            echo "==> Ensure POSTGRES_PASSWORD is URL-safe (no python3 on server)"
            if echo "$POSTGRES_PASSWORD" | grep -Eq '^[A-Za-z0-9_.~-]+$'; then
              PG_PASS_URLENC="$POSTGRES_PASSWORD"
            else
              echo "ERROR: POSTGRES_PASSWORD_DEV has special chars."
              echo "Use only A-Za-z0-9_.~- for dev OR install python3/jq and URL-encode password."
              exit 1
            fi

            # Save old password (before overwriting .env), to detect password rotation
            OLD_PASS=""
            if [ -f ".env" ]; then
              OLD_PASS="$(grep '^POSTGRES_PASSWORD=' .env | cut -d= -f2- || true)"
            fi

            echo "==> Render desired .env"
            cat > .env.desired <<EOF
            # managed-by-cd: true
            ENV_FILE_VERSION=2

            ENV=dev
            GIN_MODE=release

            JWT_SECRET=${JWT_SECRET}

            POSTGRES_USER=diplomaflow
            POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            POSTGRES_DB=diplomaflow
            POSTGRES_PORT=5432
            POSTGRES_HOST_PORT=5433

            DATABASE_DSN=host=main_postgres user=diplomaflow password=${POSTGRES_PASSWORD} dbname=diplomaflow port=5432 sslmode=disable TimeZone=UTC
            DATABASE_URL=postgres://diplomaflow:${PG_PASS_URLENC}@main_postgres:5432/diplomaflow?sslmode=disable

            REDIS_ADDR=redis:6379
            KAFKA_BROKERS=kafka:29092
            KAFKA_GROUP_ID=diplomaflow-group
            KAFKA_KRAFT_CLUSTER_ID=MkU3OEVBNTcwNTJENDM2Qk

            PORT_GATEWAY=8080
            GATEWAY_BIND_ADDR=0.0.0.0
            EOF
            chmod 600 .env.desired

            echo "==> Sync .env if changed"
            if [ ! -f .env ] || ! cmp -s .env .env.desired; then
              echo "==> Updating .env (backup old)"
              [ -f .env ] && cp .env ".env.bak.$(date +%Y%m%d_%H%M%S)"
              mv .env.desired .env
            else
              rm -f .env.desired
              echo "==> .env unchanged"
            fi

            echo "==> Validate compose config"
            dc config >/dev/null

            reset_postgres() {
              echo "==> Reset Postgres volume (dev): ${PG_VOLUME}"
              dc down --remove-orphans || true
              docker volume rm -f "${PG_VOLUME}" || true
            }

            wait_postgres_healthy() {
              echo "==> Wait for Postgres healthy"
              for i in $(seq 1 90); do
                cid="$(dc ps -q main_postgres || true)"
                if [ -n "$cid" ]; then
                  st="$(docker inspect -f '{{.State.Health.Status}}' "$cid" 2>/dev/null || true)"
                  [ "$st" = "healthy" ] && return 0
                fi
                sleep 1
              done
              cid="$(dc ps -q main_postgres || true)"
              echo "Postgres not healthy"
              [ -n "$cid" ] && docker logs --tail=200 "$cid" || true
              return 1
            }

            echo "==> Decide whether we need to build images (smart)"
            NEW_SHA="$(git rev-parse HEAD)"
            PREV_SHA=""
            if [ -f "$LAST_SHA_FILE" ]; then
              PREV_SHA="$(cat "$LAST_SHA_FILE" 2>/dev/null || true)"
            fi

            need_build=0
            need_build_migrate=0

            if [ -z "$PREV_SHA" ] || ! git cat-file -e "${PREV_SHA}^{commit}" 2>/dev/null; then
              echo "==> No previous deploy SHA found. Will build everything once."
              need_build=1
              need_build_migrate=1
            else
              changed="$(git diff --name-only "${PREV_SHA}..${NEW_SHA}" || true)"
              echo "==> Changed files since last deploy:"
              echo "$changed" | sed '/^$/d' || true

              # build-critical changes (Go code, Dockerfiles, compose, per-service config copied into images)
              if echo "$changed" | grep -Eq '^(go\.mod|go\.sum|docker-compose\.yml|cmd/|internal/|pkg/|api/|proto/|\.dockerignore|Dockerfile)'; then
                need_build=1
              fi
              if echo "$changed" | grep -Eq '^cmd/.*/config\.yaml$'; then
                need_build=1
              fi

              # migrate image MUST be rebuilt if migrations changed (it copies db/migrations into the image)
              if echo "$changed" | grep -Eq '^(db/migrations/|cmd/migrate/|cmd/migrate/Dockerfile)'; then
                need_build_migrate=1
              fi
            fi

            # Auto-fix: if password rotated, reset pg volume (otherwise postgres keeps old password in existing volume)
            if [ -n "$OLD_PASS" ] && [ "$OLD_PASS" != "$POSTGRES_PASSWORD" ]; then
              echo "==> Detected POSTGRES_PASSWORD change. Resetting Postgres volume (dev)."
              reset_postgres
            fi

            echo "==> Start infra"
            dc up -d main_postgres redis kafka
            wait_postgres_healthy

            echo "==> Build images (smart)"
            if [ "$need_build" -eq 1 ]; then
              dc build --parallel
            else
              echo "==> Skip build (no build-related changes)"
            fi

            # If only migrations changed, rebuild only migrate (fast)
            if [ "$need_build" -eq 0 ] && [ "$need_build_migrate" -eq 1 ]; then
              echo "==> Rebuild migrate image (migrations changed)"
              dc build migrate
            fi

            echo "==> Run migrations (auto-retry once with dev reset)"
            set +e
            mig_out="$(dc run --rm migrate 2>&1)"
            mig_rc=$?
            set -e

            if [ "$mig_rc" -ne 0 ]; then
              echo "$mig_out"
              echo "==> Migrations failed. Logs:"
              dc logs --tail=200 main_postgres || true

              echo "==> Auto-fix (dev): reset Postgres volume and retry migrations once"
              reset_postgres
              dc up -d main_postgres redis kafka
              wait_postgres_healthy

              # if migrate image was missing/outdated, rebuild it
              dc build migrate
              dc run --rm migrate
            fi

            echo "==> Start app services (no-build)"
            set +e
            dc up -d --remove-orphans --no-build
            up_rc=$?
            set -e

            if [ "$up_rc" -ne 0 ]; then
              echo "==> docker compose up failed."
              echo "==> If it failed due to missing images, we build and retry once."
              dc build --parallel
              dc up -d --remove-orphans --no-build
            fi

            echo "==> Healthcheck gateway"
            sleep 15
            curl -fsS "http://localhost:8080/healthz" >/dev/null

            echo "==> Status"
            dc ps

            echo "==> Fail if something is unhealthy"
            if dc ps | grep -q unhealthy; then
              echo "Some services are unhealthy. Last logs:"
              dc logs --tail=200
              exit 1
            fi

            echo "==> Mark successful deploy SHA"
            echo "$NEW_SHA" > "$LAST_SHA_FILE"
