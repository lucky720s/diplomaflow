name: CD - Deploy to Dev Server

on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail

            APP_DIR="/opt/diplomaflow"

            echo "Ensuring app dir exists: $APP_DIR"
            mkdir -p "$APP_DIR" 2>/dev/null || sudo mkdir -p "$APP_DIR"
            cd "$APP_DIR" || { echo "ERROR: cannot cd into $APP_DIR"; exit 1; }

            echo "Sync repo..."
            if [ -d ".git" ]; then
              echo "Git repo exists, updating..."
              git remote set-url origin "https://${{ secrets.PAT_TOKEN }}@github.com/${{ github.repository }}.git"
              git fetch origin dev
              git reset --hard origin/dev
              git clean -fd
            else
              echo "No git repo, cloning..."
              rm -rf "$APP_DIR"
              mkdir -p "$APP_DIR" 2>/dev/null || sudo mkdir -p "$APP_DIR"
              cd "$APP_DIR"
              git clone -b dev "https://${{ secrets.PAT_TOKEN }}@github.com/${{ github.repository }}.git" .
            fi

            echo "Current directory contents:"
            ls -la

            if [ ! -f ".env" ]; then
              echo "Creating .env file..."
              cat > .env <<'ENVEOF'
            ENV=production
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_DB=${{ secrets.POSTGRES_DB }}
            POSTGRES_PORT=5432
            DATABASE_DSN=${{ secrets.DATABASE_DSN }}
            KAFKA_BROKERS=${{ secrets.KAFKA_BROKERS }}
            KAFKA_GROUP_ID=${{ secrets.KAFKA_GROUP_ID }}
            KAFKA_KRAFT_CLUSTER_ID=${{ secrets.KAFKA_KRAFT_CLUSTER_ID }}
            GIN_MODE=release
            PORT_GATEWAY=8080
            PORT_UNIVERSITY=8081
            PORT_AUTH=8082
            PORT_PROJECT=8083
            PORT_TEAM=8084
            PORT_WORKFLOW=8085
            PORT_ROLE=8086
            PORT_NOTIFICATION=8087
            PORT_FILE=8088
            PORT_FORM=8089
            PORT_ADMIN=8090
            SERVICES_AUTH_ADDR=auth_service:8082
            SERVICES_PROJECT_ADDR=project_service:8083
            SERVICES_TEAM_ADDR=team_service:8084
            SERVICES_UNIVERSITY_ADDR=university_service:8081
            SERVICES_ROLE_ADDR=role_service:8086
            SERVICES_WORKFLOW_ADDR=workflow_service:8085
            SERVICES_NOTIFICATION_ADDR=notification_service:8087
            SERVICES_FILE_ADDR=file_service:8088
            SERVICES_FORM_ADDR=form_service:8089
            SERVICES_ADMIN_ADDR=admin_service:8090
            ENVEOF
            fi

            echo "Checking docker-compose.yml..."
            if [ ! -f "docker-compose.yml" ]; then
              echo "ERROR: docker-compose.yml not found!"
              ls -la
              exit 1
            fi

            echo "Stopping old containers..."
            docker compose down --remove-orphans || true

            echo "Building images..."
            docker compose build --no-cache

            echo "Starting services..."
            docker compose up -d

            echo "Waiting for services to start..."
            sleep 90

            echo "Health check..."
            curl -fsS http://localhost:8080/health || echo "Health check failed but continuing..."

            echo "Service status:"
            docker compose ps

      - name: Deployment complete
        run: echo "Deployment completed!"
