name: CD - Deploy to Dev Server

on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known_hosts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy deploy script
        shell: bash
        run: |
          scp -p scripts/deploy_dev.sh "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/tmp/deploy_dev.sh"

      - name: Run deploy script
        shell: bash
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          JWT_SECRET: ${{ secrets.JWT_SECRET_DEV }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD_DEV }}
        run: |
          set -euo pipefail
          ssh "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            "PAT_TOKEN=$(printf %q "$PAT_TOKEN") JWT_SECRET=$(printf %q "$JWT_SECRET") POSTGRES_PASSWORD=$(printf %q "$POSTGRES_PASSWORD") REPO=$(printf %q '${{ github.repository }}') BRANCH=dev bash /tmp/deploy_dev.sh"
