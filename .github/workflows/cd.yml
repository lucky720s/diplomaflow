name: CD - Deploy to Dev Server

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: migrate
            dockerfile: cmd/migrate/Dockerfile
          - image: api_gateway
            dockerfile: cmd/api_gateway/Dockerfile
          - image: university_service
            dockerfile: cmd/university_service/Dockerfile
          - image: auth_service
            dockerfile: cmd/auth_service/Dockerfile
          - image: project_service
            dockerfile: cmd/project_service/Dockerfile
          - image: team_service
            dockerfile: cmd/team_service/Dockerfile
          - image: workflow_service
            dockerfile: cmd/workflow_service/Dockerfile
          - image: role_service
            dockerfile: cmd/role_service/Dockerfile
          - image: notification_service
            dockerfile: cmd/notification_service/Dockerfile
          - image: file_service
            dockerfile: cmd/file_service/Dockerfile
          - image: form_service
            dockerfile: cmd/form_service/Dockerfile
          - image: admin_service
            dockerfile: cmd/admin_service/Dockerfile
          - image: task_service
            dockerfile: cmd/task_service/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Set image vars
        run: |
          echo "IMAGE_BASE=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV
          echo "IMAGE_TAG=dev" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/${{ matrix.image }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_BASE }}/${{ matrix.image }}:${{ env.IMAGE_TAG }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build_and_push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy deploy script
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "deploy/deploy.sh"
          target: "/opt/diplomaflow_scripts"
          overwrite: true

      - name: Deploy via SSH (pull & up)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script: |
            set -e
            chmod +x /opt/diplomaflow_scripts/deploy/deploy.sh
            /opt/diplomaflow_scripts/deploy/deploy.sh \
              "/opt/diplomaflow" \
              "${{ secrets.PAT_TOKEN }}" \
              "${{ secrets.JWT_SECRET_DEV }}" \
              "${{ secrets.POSTGRES_PASSWORD_DEV }}" \
              "${{ github.repository }}" \
              "dev" \
              "ghcr.io/${{ github.repository }}" \
              "dev" \
              "${{ secrets.GHCR_USERNAME }}" \
              "${{ secrets.GHCR_TOKEN }}"
