run:
  timeout: 10m
  go: '1.25'
  tests: true

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports

linters-settings:
  govet:
    enable:
      - shadow
  errcheck:
    check-type-assertions: true

issues:
  exclude-dirs:
    - pkg/protobuf
    - third_party
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
    - path: wire_gen\.go
      linters:
        - unused
        - deadcode
    - path: \.pb\.go
      linters:
        - all
    - path: \.pb\.validate\.go
      linters:
        - all
