run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  disable-all: true
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
    - path: wire_gen\.go
      linters:
        - errcheck
        - unused
    - path: \.pb\.go
      linters:
        - errcheck
        - unused
    - path: \.pb\.validate\.go
      linters:
        - errcheck
        - unused
