syntax = "proto3";

package auth.v1;
import "role/v1/role.proto";
option go_package = "github.com/lucky720s/diplomaflow/pkg/protobuf/auth/v1";

service AuthService{
  rpc Register(RegisterRequest)
      returns(RegisterResponse);
  rpc Login(LoginRequest)
      returns(LoginResponse);
  rpc GetUser(GetUserRequest)
      returns (GetUserResponse);
  rpc AssignRole(AssignRoleRequest)
      returns (AssignRoleResponse);
  rpc SetDepartment(SetDepartmentRequest)
      returns (SetDepartmentResponse);
}

message RegisterRequest{
  string email = 1;
  string password = 2;
  int64 university_id = 3;
}

message RegisterResponse{
  int64 user_id = 1;
}

message LoginRequest{
  string email = 1;
  string password = 2;
}

message LoginResponse{
  string token = 1;
}

message GetUserRequest{
  int64 user_id = 1;
}
message GetUserResponse{
  int64 id = 1;
  string email = 2;
  int64  department_id = 3;
  repeated role.v1.Role roles = 4;
}
message AssignRoleRequest{
  int64 user_id = 1;
  int64 role_id = 2;
}
message AssignRoleResponse{
  bool success = 1;
}

message SetDepartmentRequest{
  int64 user_id=1;
  int64 department_id=2;
}
message SetDepartmentResponse{
  bool success=1;
}