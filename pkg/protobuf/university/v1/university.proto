syntax = "proto3";

package university.v1;
option go_package = "pkg/protobuf/university/v1";

service UniversityService{
  rpc CreateUniversity(CreateUniversityRequest) returns (CreateUniversityResponse);
  rpc GetUniversity(GetUniversityRequest) returns (GetUniversityResponse);
  rpc CreateDepartment(CreateDepartmentRequest) returns (CreateDepartmentResponse);
  rpc GetDepartment(GetDepartmentRequest) returns (GetDepartmentResponse);
}

message University{
  int64 id = 1;
  string name = 2;
  string short_name = 3;
}
message Department{
  int64 id = 1;
  string name = 2;
  int64 university_id = 3;
}
message CreateUniversityRequest{
  string name = 1;
  string short_name = 2;
}
message CreateUniversityResponse{
  University university = 1;
}
message GetUniversityRequest{
  oneof identifier {
    int64 id = 1;
    string short_name = 2;
  }
}
message GetUniversityResponse{
  University university = 1;
}
message CreateDepartmentRequest{
  string name = 1;
  int64 university_id = 2;
}
message CreateDepartmentResponse{
  Department department = 1;
}
message GetDepartmentRequest{
  int64 department_id = 1;
}
message GetDepartmentResponse{
  Department department = 1;
}