syntax = "proto3";

package project;

option go_package = "pkg/protobuf/project";

service ProjectService{
  rpc CreateProject(CreateProjectRequest)
      returns (CreateProjectResponse);
}
message CreateProjectRequest{
  string topic = 1;
  int64 supervisor_id = 2;
  repeated int64 student_ids = 3;
  int64 department_id = 4;
}
message CreateProjectResponse{
  int64 project_id =1;
}