name: diplomaflow

x-common-env: &common_env
  ENV: ${ENV:-production}
  DATABASE_DSN: ${DATABASE_DSN:?DATABASE_DSN is required}

x-service-addrs-host: &svc_addrs_host
  SERVICES_AUTH_ADDR: 127.0.0.1:8082
  SERVICES_UNIVERSITY_ADDR: 127.0.0.1:8081
  SERVICES_PROJECT_ADDR: 127.0.0.1:8083
  SERVICES_TEAM_ADDR: 127.0.0.1:8084
  SERVICES_WORKFLOW_ADDR: 127.0.0.1:8085
  SERVICES_ROLE_ADDR: 127.0.0.1:8086
  SERVICES_NOTIFICATION_ADDR: 127.0.0.1:8087
  SERVICES_FILE_ADDR: 127.0.0.1:8088
  SERVICES_FORM_ADDR: 127.0.0.1:8089
  SERVICES_ADMIN_ADDR: 127.0.0.1:8090
  SERVICES_TASK_ADDR: 127.0.0.1:8091

services:
  migrate:
    image: ${IMAGE_PREFIX:?IMAGE_PREFIX is required}-migrate:${IMAGE_TAG:?IMAGE_TAG is required}
    network_mode: host
    depends_on:
      main_postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    command: ["-cmd=up", "-path=file:///app/db/migrations"]
    restart: "no"

  api_gateway:
    image: ${IMAGE_PREFIX:?IMAGE_PREFIX is required}-api_gateway:${IMAGE_TAG:?IMAGE_TAG is required}
    network_mode: host
    environment:
      ENV: ${ENV:-production}
      PORT: "8080"
      REDIS_ADDR: ${REDIS_ADDR:-127.0.0.1:6380}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      <<: *svc_addrs_host
    depends_on:
      redis:
        condition: service_healthy
      auth_service:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null 2>&1"]
      interval: 10s
      timeout: 3s
      retries: 15
      start_period: 10s
    restart: unless-stopped

  university_service:
    image: ${IMAGE_PREFIX:?}-university_service:${IMAGE_TAG:?}
    network_mode: host
    environment:
      <<: *common_env
      GRPC_PORT: "8081"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=127.0.0.1:8081", "-service=university.v1.UniversityService"]
      interval: 10s
      timeout: 3s
      retries: 15
      start_period: 20s
    restart: unless-stopped

  role_service:
    image: ${IMAGE_PREFIX:?}-role_service:${IMAGE_TAG:?}
    network_mode: host
    environment:
      <<: *common_env
      GRPC_PORT: "8086"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=127.0.0.1:8086", "-service=role.v1.RoleService"]
      interval: 10s
      timeout: 3s
      retries: 15
      start_period: 20s
    restart: unless-stopped

  auth_service:
    image: ${IMAGE_PREFIX:?}-auth_service:${IMAGE_TAG:?}
    network_mode: host
    environment:
      <<: *common_env
      GRPC_PORT: "8082"
      REDIS_ADDR: ${REDIS_ADDR:-127.0.0.1:6380}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-720h}
      SERVICES_UNIVERSITY_ADDR: 127.0.0.1:8081
      SERVICES_ROLE_ADDR: 127.0.0.1:8086
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      university_service:
        condition: service_started
      role_service:
        condition: service_started
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=127.0.0.1:8082", "-service=auth.v1.AuthService"]
      interval: 10s
      timeout: 3s
      retries: 15
      start_period: 20s
    restart: unless-stopped

  notification_service:
    image: ${IMAGE_PREFIX:?}-notification_service:${IMAGE_TAG:?}
    network_mode: host
    environment:
      <<: *common_env
      GRPC_PORT: "8087"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=127.0.0.1:8087", "-service=notification.v1.NotificationService"]
      interval: 10s
      timeout: 3s
      retries: 15
      start_period: 20s
    restart: unless-stopped

  workflow_service:
    image: ${IMAGE_PREFIX:?}-workflow_service:${IMAGE_TAG:?}
    network_mode: host
    environment:
      <<: *common_env
      GRPC_PORT: "8085"
      SERVICES_NOTIFICATION_ADDR: 127.0.0.1:8087
      SERVICES_PROJECT_ADDR: 127.0.0.1:8083
      SERVICES_TEAM_ADDR: 127.0.0.1:8084
    depends_on:
      migrate:
        condition: service_completed_successfully
      notification_service:
        condition: service_started
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=127.0.0.1:8085", "-service=workflow.v1.WorkflowService"]
      interval: 10s
      timeout: 3s
      retries: 15
      start_period: 20s
    restart: unless-stopped

  project_service:
    image: ${IMAGE_PREFIX:?}-project_service:${IMAGE_TAG:?}
    network_mode: host
    environment:
      <<: *common_env
      GRPC_PORT: "8083"
      SERVICES_WORKFLOW_ADDR: 127.0.0.1:8085
      SERVICES_NOTIFICATION_ADDR: 127.0.0.1:8087
    depends_on:
      migrate:
        condition: service_completed_successfully
      workflow_service:
        condition: service_started
      notification_service:
        condition: service_started
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=127.0.0.1:8083", "-service=project.v1.ProjectService"]
      interval: 10s
      timeout: 3s
      retries: 15
      start_period: 20s
    restart: unless-stopped

  team_service:
    image: ${IMAGE_PREFIX:?}-team_service:${IMAGE_TAG:?}
    network_mode: host
    environment:
      <<: *common_env
      GRPC_PORT: "8084"
      SERVICES_AUTH_ADDR: 127.0.0.1:8082
      SERVICES_WORKFLOW_ADDR: 127.0.0.1:8085
      SERVICES_NOTIFICATION_ADDR: 127.0.0.1:8087
    depends_on:
      migrate:
        condition: service_completed_successfully
      auth_service:
        condition: service_started
      workflow_service:
        condition: service_started
      notification_service:
        condition: service_started
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=127.0.0.1:8084", "-service=team.v1.TeamService"]
      interval: 10s
      timeout: 3s
      retries: 15
      start_period: 20s
    restart: unless-stopped

  file_service:
    image: ${IMAGE_PREFIX:?}-file_service:${IMAGE_TAG:?}
    network_mode: host
    environment:
      <<: *common_env
      GRPC_PORT: "8088"
      STORAGE_PATH: "/uploads"
    volumes:
      - file_uploads:/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=127.0.0.1:8088", "-service=file.v1.FileService"]
      interval: 10s
      timeout: 3s
      retries: 15
      start_period: 20s
    restart: unless-stopped

  form_service:
    image: ${IMAGE_PREFIX:?}-form_service:${IMAGE_TAG:?}
    network_mode: host
    environment:
      <<: *common_env
      GRPC_PORT: "8089"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=127.0.0.1:8089", "-service=form.v1.FormService"]
      interval: 10s
      timeout: 3s
      retries: 15
      start_period: 20s
    restart: unless-stopped

  admin_service:
    image: ${IMAGE_PREFIX:?}-admin_service:${IMAGE_TAG:?}
    network_mode: host
    environment:
      <<: *common_env
      GRPC_PORT: "8090"
      SERVICES_AUTH_ADDR: 127.0.0.1:8082
      SERVICES_PROJECT_ADDR: 127.0.0.1:8083
      SERVICES_TEAM_ADDR: 127.0.0.1:8084
      SERVICES_WORKFLOW_ADDR: 127.0.0.1:8085
    depends_on:
      migrate:
        condition: service_completed_successfully
      auth_service:
        condition: service_started
      project_service:
        condition: service_started
      team_service:
        condition: service_started
      workflow_service:
        condition: service_started
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=127.0.0.1:8090", "-service=admin.v1.AdminService"]
      interval: 10s
      timeout: 3s
      retries: 15
      start_period: 20s
    restart: unless-stopped

  task_service:
    image: ${IMAGE_PREFIX:?}-task_service:${IMAGE_TAG:?}
    network_mode: host
    environment:
      <<: *common_env
      GRPC_PORT: "8091"
      SERVICES_AUTH_ADDR: 127.0.0.1:8082
      SERVICES_TEAM_ADDR: 127.0.0.1:8084
      SERVICES_NOTIFICATION_ADDR: 127.0.0.1:8087
      SERVICES_FILE_ADDR: 127.0.0.1:8088
    depends_on:
      migrate:
        condition: service_completed_successfully
      auth_service:
        condition: service_started
      team_service:
        condition: service_started
      notification_service:
        condition: service_started
      file_service:
        condition: service_started
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=127.0.0.1:8091", "-service=task.v1.TaskService"]
      interval: 10s
      timeout: 3s
      retries: 15
      start_period: 20s
    restart: unless-stopped

volumes:
  file_uploads:
