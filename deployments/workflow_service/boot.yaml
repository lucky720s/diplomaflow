grpc:
  - name: workflow-service
    port: 8085
    enabled: true
    reflection: true

postgres:
  - name: workflow-conn
    enabled: true
    addr: "main_postgres:5432"
    user: "diplomaflow"
    pass: "diplomaflow_pass"
    timezone: "Asia/Shanghai"
    database:
      - name: "diplomaflow"
        autoCreate: false
    params:
      search_path: "workflow_schema"