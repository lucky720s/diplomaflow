---
grpc:
  - name: workflow-service
    port: 8085
    enabled: true

postgres:
  - name: workflow-conn
    enabled: true
    domain: "*"
    addr: "main_postgres:5432"
    user: diplomaflow
    pass: diplomaflow_pass
    dbType: postgres
    database:
      - name: diplomaflow
        autoCreate: true
