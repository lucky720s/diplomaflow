grpc:
  - name: tenant-service
    port: 8081
    enabled: true
    reflection: true

postgres:
  - name: tenant-conn
    enabled: true
    addr: "tenant_db:5432"
    user: "tenant_user"
    pass: "tenant_password"
    timezone: "Asia/Shanghai"
    database:
      - name: "tenant_db"
        autoCreate: true