---
grpc:
  - name: role-service
    port: 8086
    enabled: true
    reflection: true

postgres:
  - name: role-conn
    enabled: true
    addr: "main_postgres:5432"
    user: "diplomaflow"
    pass: "diplomaflow_pass"
    timezone: "Asia/Shanghai"
    database:
      - name: "diplomaflow"
        autoCreate: false
    params:
      search_path: "role_schema"