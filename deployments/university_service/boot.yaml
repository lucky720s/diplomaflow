grpc:
  - name: university-service
    port: 8081
    enabled: true
    reflection: true

postgres:
  - name: university-conn
    enabled: true
    addr: "main_postgres:5432"
    user: "diplomaflow"
    pass: "diplomaflow_pass"
    timezone: "Asia/Shanghai"
    database:
      - name: "diplomaflow"
        autoCreate: true
    params:
      search_path: "university_schema"
