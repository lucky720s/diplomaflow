services:
  tenant_db:
    image: postgres:14-alpine
    container_name: tenant_db
    environment:
      - POSTGRES_USER=tenant_user
      - POSTGRES_PASSWORD=tenant_password
      - POSTGRES_DB=tenant_db
    ports:
      - "5431:5432"
    volumes:
      - tenant_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenant_user -d tenant_db"]
      interval: 5s
      timeout: 5s
      retries: 5
  tenant_service:
    build:
      context: ../../
      dockerfile: cmd/tenant_service/Dockerfile
    container_name: tenant_service
    ports:
      - "8081:8081"
    depends_on:
      tenant_db:
        condition: service_healthy
    environment:
      DB_HOST: tenant_db
      DB_PORT: 5432
      DB_USER: tenant_user
      DB_PASSWORD: tenant_password
      DB_NAME: tenant_db
  auth_db:
    image: postgres:14-alpine
    container_name: auth_db
    environment:
      - POSTGRES_USER=auth_user
      - POSTGRES_PASSWORD=auth_password
      - POSTGRES_DB=auth_db
    ports:
      - "5432:5432"
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U auth_user -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 5
  auth_service:
    build:
      context: ../../
      dockerfile: cmd/auth_service/Dockerfile
    container_name: auth_service
    ports:
      - "8082:8082"
    depends_on:
      auth_db:
        condition: service_healthy
    environment:
      - AUTH_DB_HOST=auth_db
      - AUTH_DB_PORT=5432
      - AUTH_DB_USER=auth_user
      - AUTH_DB_PASSWORD=auth_password
      - AUTH_DB_NAME=auth_db
      - JWT_SECRET=Nurken222
  project_db:
    image: postgres:14-alpine
    container_name: project_db
    environment:
      - POSTGRES_USER=project_user
      - POSTGRES_PASSWORD=project_password
      - POSTGRES_DB=project_db
    ports:
      - "5433:5432"
    volumes:
      - project_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U project_user -d project_db"]
      interval: 5s
      timeout: 5s
      retries: 5
  project_service:
    build:
      context: ../../
      dockerfile: cmd/project_service/Dockerfile
    container_name: project_service
    ports:
      - "8083:8083"
    depends_on:
      project_db:
        condition: service_healthy
      auth_service:
        condition: service_started
    environment:
      - PROJECT_DB_HOST=project_db
      - PROJECT_DB_PORT=5432
      - PROJECT_DB_USER=project_user
      - PROJECT_DB_PASSWORD=project_password
      - PROJECT_DB_NAME=project_db
volumes:
  tenant_db_data:
  auth_db_data:
  project_db_data:

