version: '3.8'

services:
  tenant_db:
    image: postgres:14-alpine
    container_name: tenant_db
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=tenant_db
    ports:
      - "5431:5432"
    volumes:
      - tenant_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d tenant_db"]
      interval: 5s
      timeout: 5s
      retries: 5
  tenant_service:
    build:
      context: ../../
      dockerfile: cmd/tenant_service/Dockerfile
    container_name: tenant_service
    ports:
      - "8081:8081"
    depends_on:
      tenant_db:
        condition: service_healthy
    environment:
      DB_HOST: tenant_db
      DB_PORT: 5432
      DB_USER: user
      DB_PASSWORD: password
      DB_NAME: tenant_db
  auth_db:
    image: postgres:14-alpine
    container_name: auth_db
    environment:
      - POSTGRES_USER=auth_user
      - POSTGRES_PASSWORD=auth_password
      - POSTGRES_DB=auth_db
    ports:
      - "5432:5432"
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U auth_user -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 5
  auth_service:
    build:
      context: ../../
      dockerfile: cmd/auth_service/Dockerfile
    container_name: auth_service
    ports:
      - "8082:8082"
    depends_on:
      auth_db:
        condition: service_healthy
    environment:
      - AUTH_DB_HOST=auth_db
      - AUTH_DB_PORT=5432
      - AUTH_DB_USER=auth_user
      - AUTH_DB_PASSWORD=auth_password
      - AUTH_DB_NAME=auth_db
      - JWT_SECRET=Nurken222

volumes:
  tenant_db_data:
  auth_db_data:

