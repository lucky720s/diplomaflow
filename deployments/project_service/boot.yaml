grpc:
  - name: project-service
    port: 8083
    enabled: true
    reflection: true

postgres:
  - name: project-conn
    enabled: true
    addr: "project_db:5432"
    user: "project_user"
    pass: "project_password"
    timezone: "Asia/Shanghai"
    database:
      - name: "project_db"
        autoCreate: true