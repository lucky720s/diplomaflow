name: diplomaflow

services:
  main_postgres:
    image: postgres:16-alpine
    network_mode: host
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-diplomaflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-diplomaflow}
      PGPORT: "5433"
    command: -p 5433
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -h 127.0.0.1 -p 5433"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    network_mode: host
    command: redis-server --port 6380
    healthcheck:
      test: ["CMD", "redis-cli", "-h", "127.0.0.1", "-p", "6380", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  pg_data:
